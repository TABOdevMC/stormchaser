<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser 3D</title><link rel="icon" href="data:,"><style>html,body{margin:0;height:100%;overflow:hidden;background:#020810;color:#eef8ff;font:14px system-ui,Arial}#gl{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(4,12,20,.84);border:1px solid #496276;border-radius:10px;padding:10px;backdrop-filter:blur(7px);pointer-events:auto;box-shadow:0 8px 28px #0008}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;background:#02070b;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right;background:#263c4b;color:#fff;border:0;border-radius:6px;padding:6px 10px}</style></head><body><canvas id="gl"></canvas><div class="hud"><div class="top"><div class="panel"><b>🌩️ STORM CHASER 3D</b><br><span>Supercellule HP · mésocyclone actif</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div><small id="productText">Radar simulé · Z · balayage 0.5°</small></div><div class="bottom"><button id="zBtn">📡<br><small>Z</small></button><button id="vBtn">💨<br><small>VEL</small></button><button id="stormBtn">🌪️<br><small>Storm</small></button><button id="adminBtn">🛠️<br><small>Admin</small></button></div></div><div id="modal" class="modal"><div class="window"><button class="close" id="closeBtn">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
(function(){'use strict';
var canvas=document.getElementById('gl'),gl=canvas.getContext('webgl',{antialias:true,alpha:false});if(!gl){document.body.innerHTML='<div style="padding:30px">WebGL n’est pas disponible sur ce navigateur.</div>';return}
var vs='attribute vec3 p;attribute float s;attribute vec4 c;uniform mat4 mvp;varying vec4 vc;void main(){gl_Position=mvp*vec4(p,1.0);gl_PointSize=s/(gl_Position.w)*520.0;vc=c;}';
var fs='precision mediump float;varying vec4 vc;void main(){vec2 q=gl_PointCoord-.5;float d=dot(q,q);if(d>.25)discard;float a=smoothstep(.25,0.02,d)*vc.a;gl_FragColor=vec4(vc.rgb,a);}';
function shader(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}var prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);var bp=gl.getAttribLocation(prog,'p'),bs=gl.getAttribLocation(prog,'s'),bc=gl.getAttribLocation(prog,'c'),um=gl.getUniformLocation(prog,'mvp');
function mul(a,b){var o=new Float32Array(16);for(var r=0;r<4;r++)for(var c=0;c<4;c++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function perspective(fov,asp,n,f){var q=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=q/asp;o[5]=q;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function look(ex,ey,ez,cx,cy,cz){var zx=ex-cx,zy=ey-cy,zz=ez-cz,l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;var xx=zy,xy=-zx,xz=0,l2=Math.hypot(xx,xy);xx/=l2;xy/=l2;var yx=xy*zz,y y=zz*xx-zx*xz;var o=new Float32Array(16);o[0]=xx;o[1]=yx;o[2]=zx;o[4]=xy;o[5]=y y;o[6]=zy;o[8]=xz;o[9]=zz*xx-zx*xy;o[10]=zz;o[12]=-(xx*ex+xy*ey+xz*ez);o[13]=-(yx*ex+y y*ey+(zz*xx-zx*xy)*ez);o[14]=-(zx*ex+zy*ey+zz*ez);o[15]=1;return o}
/* fix the two deliberately explicit components without external libraries */
function view(ex,ey,ez,cx,cy,cz){var fx=cx-ex,fy=cy-ey,fz=cz-ez,fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;var rx=fz,ry=0,rz=-fx,rl=Math.hypot(rx,ry,rz);rx/=rl;rz/=rl;var ux=ry*fz-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy-ry*fx;return new Float32Array([rx,ux,-fx,0,ry,uy,-fy,0,rz,uz,-fz,0,-(rx*ex+ry*ey+rz*ez),-(ux*ex+uy*ey+uz*ez),fx*ex+fy*ey+fz*ez,1])}
var points=[],colors=[],sizes=[];function add(x,y,z,s,r,g,b,a){points.push(x,y,z);sizes.push(s);colors.push(r,g,b,a)}function cloud(cx,cy,cz,rx,ry,rz,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,u=Math.random()*2-1,v=Math.random();var rr=Math.sqrt(1-u*u);add(cx+Math.cos(a)*rr*rx*v,cy+u*ry*v,cz+Math.sin(a)*rr*rz*v,18+Math.random()*30,.22+.16*v,.27+.17*v,.29+.19*v,.16+.32*v)}}
/* volumetric cumulonimbus: layered lobes + broad anvil */for(var i=0;i<11;i++)cloud(-1+i*.28,2.8+Math.sin(i)*.12,0,1.25-i*.035,.55,.95,150);for(i=0;i<18;i++)cloud((i-9)*.48,3.25+Math.random()*.35,.1+Math.random()*.35,1.0,.55,1.1,120);cloud(0,4.15,0,3.8,.65,1.5,900);cloud(-2.4,3.8,.2,1.8,.5,1.1,300);cloud(2.4,3.75,.3,1.8,.5,1.1,300);
/* rain curtain */for(i=0;i<700;i++){var rx=(Math.random()*5-2.5),rz=Math.random()*2.5-.3;add(rx,.2+Math.random()*3.1,rz,5, .46,.54,.56,.16)}
/* tornado: 3D rotating cone of condensation */for(i=0;i<900;i++){var u=Math.random(),y=.1+u*2.4,rad=.08+Math.pow(u,.78)*.72;var a=Math.random()*Math.PI*2;add(Math.cos(a)*rad,y,Math.sin(a)*rad,6+u*8,.35+.12*(1-u),.39+.14*(1-u),.4+.15*(1-u),.18+.28*(1-u))}
/* ground dust */for(i=0;i<250;i++){var da=Math.random()*Math.PI*2,dr=Math.random()*.9;add(Math.cos(da)*dr,.05+Math.random()*.12,Math.sin(da)*dr,7,.43,.40,.34,.2)}
var pb=gl.createBuffer(),cb=gl.createBuffer(),sb=gl.createBuffer();gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
function upload(){gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(points),gl.STATIC_DRAW);gl.vertexAttribPointer(bp,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(bp);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(colors),gl.STATIC_DRAW);gl.vertexAttribPointer(bc,4,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(bc);gl.bindBuffer(gl.ARRAY_BUFFER,sb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(sizes),gl.STATIC_DRAW);gl.vertexAttribPointer(bs,1,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(bs)}upload();
var time=0;function render(){var d=window.devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.015,.035,.055,1);gl.clear(gl.COLOR_BUFFER_BIT);var ang=time*.045,ex=Math.sin(ang)*8,ez=Math.cos(ang)*8,ey=4.2;var mvp=mul(perspective(1.0,canvas.width/canvas.height,.1,100),view(ex,ey,ez,0,2.1,0));gl.uniformMatrix4fv(um,false,mvp);gl.drawArrays(gl.POINTS,0,points.length/3);time++;requestAnimationFrame(render)}addEventListener('resize',function(){});render();
/* radar */var rc=document.getElementById('radarCanvas'),r=rc.getContext('2d'),product='ref';function radar(){var im=r.createImageData(360,360),cx=180,cy=180;for(var y=0;y<360;y++)for(var x=0;x<360;x++){var dx=(x-cx)/180,dy=(y-cy)/180,v=0;var ps=[[-.25,-.35,.22,1],[.28,-.05,.14,.7],[.52,.35,.1,.55]];for(var k=0;k<ps.length;k++){var p=ps[k],q=Math.hypot(dx-p[0],dy-p[1]);v=Math.max(v,Math.exp(-q*q/(p[2]*1.2))*85*p[3])}var rr=0,gg=0,bb=0;if(product==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{var z=((x-cx)*.9-(y-cy)*.55+Math.sin(time*.05)*18)*v/50,a=Math.min(1,Math.abs(z)/60);if(z<0){bb=230*a;gg=130*a}else{rr=235*a;gg=80*a;bb=45*a}}var n=(y*360+x)*4;im.data[n]=rr;im.data[n+1]=gg;im.data[n+2]=bb;im.data[n+3]=255}r.putImageData(im,0,0);r.strokeStyle='rgba(255,255,255,.3)';for(var q=45;q<=135;q+=45){r.beginPath();r.arc(180,180,q,0,Math.PI*2);r.stroke()}r.beginPath();r.moveTo(180,0);r.lineTo(180,360);r.moveTo(0,180);r.lineTo(360,180);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(180,180,4,0,Math.PI*2);r.fill()}function setProduct(p){product=p;refBtn.classList.toggle('active',p==='ref');velBtn.classList.toggle('active',p==='vel');productText.textContent=p==='ref'?'Radar simulé · réflectivité Z · dBZ · 0.5°':'Radar simulé · vélocité radiale VEL · kt · 0.5°';minL.textContent=p==='ref'?'5 dBZ':'-60 kt';midL.textContent=p==='ref'?'45 dBZ':'0 kt';maxL.textContent=p==='ref'?'70+ dBZ':'+60 kt'}refBtn.onclick=function(){setProduct('ref')};velBtn.onclick=function(){setProduct('vel')};zBtn.onclick=function(){setProduct('ref')};vBtn.onclick=function(){setProduct('vel')};setInterval(radar,100);radar();
var modal=document.getElementById('modal');function stormInfo(){modal.classList.add('show');mt.textContent='🌪️ Supercellule 3D';mb.innerHTML='<p>Structure volumétrique · enclume · updraft · wall cloud</p><p>Rotation mésocyclonique simulée avec circulation 3D.</p><p>Rideau de pluie + tornade + poussière au sol.</p>'}function admin(){modal.classList.add('show');mt.textContent='🛠️ Administration';mb.innerHTML='<p>Moteur WebGL natif · aucune bibliothèque externe.</p><button id="reset">Réinitialiser</button>';reset.onclick=function(){location.reload()}}stormBtn.onclick=stormInfo;adminBtn.onclick=admin;closeBtn.onclick=function(){modal.classList.remove('show')};addEventListener('keydown',function(e){if(e.key.toLowerCase()==='z')admin();if(e.key==='Escape')modal.classList.remove('show')});
})();</script></body></html>
