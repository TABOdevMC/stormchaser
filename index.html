<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Chaser</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a;color:#eef8ff;font-family:system-ui,Arial,sans-serif}
#world{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:#07121de8;border:1px solid #4d6677;border-radius:10px;padding:10px;backdrop-filter:blur(6px);pointer-events:auto}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{display:block;width:360px;height:360px;background:#02070b;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#a5bac7;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.bottom button{font-size:19px;width:66px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right;background:#233846;color:white;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div class="hud">
<div class="top">
<div class="panel"><b>🌪️ STORM CHASER</b><br><span id="status">Supercellule HP — mésocyclone actif</span></div>
<div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div>
</div>
<div class="radar panel">
<div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div>
<canvas id="radarCanvas" width="360" height="360"></canvas>
<div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div>
<small id="productText">NEXRAD simulé · réflectivité Z · balayage 0.5°</small>
</div>
<div class="bottom"><button id="zBtn">📡<br><small>Z</small></button><button id="velHot">💨<br><small>VEL</small></button><button id="stormBtn">🌪️<br><small>Storms</small></button><button id="adminBtn">🛠️<br><small>Admin</small></button></div>
</div>
<div id="modal" class="modal"><div class="window"><button class="close" id="closeBtn">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div>
<script>
(function(){
'use strict';
const world=document.getElementById('world');
const g=world.getContext('2d');
const radarCanvas=document.getElementById('radarCanvas');
const r=radarCanvas.getContext('2d');
let t=0;
let rotation=0;
let product='ref';
let flash=0;

function resize(){world.width=window.innerWidth;world.height=window.innerHeight;}
window.addEventListener('resize',resize);
resize();

function puff(x,y,rx,ry,alpha,light){
 g.save();
 g.globalAlpha=alpha;
 const grad=g.createRadialGradient(x,y,0,x,y,rx);
 if(light){grad.addColorStop(0,'#75858d');grad.addColorStop(.55,'#303e45');}
 else{grad.addColorStop(0,'#050b10');grad.addColorStop(.55,'#17232b');}
 grad.addColorStop(1,'rgba(8,15,21,0)');
 g.fillStyle=grad;
 g.beginPath();
 g.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 g.fill();
 g.restore();
}

function drawSupercell(sx,sy){
 g.save();
 g.translate(sx,sy);
 g.rotate(-0.08+Math.sin(t*0.12)*0.01);
 puff(-70,-105,230,68,.92,false);
 puff(100,-95,200,62,.86,false);
 puff(-185,-72,135,48,.72,false);
 for(let i=0;i<10;i++){
  const yy=-58+i*12;
  const rx=215-i*13;
  g.strokeStyle=i%2===0?'#3e4d55':'#26343c';
  g.globalAlpha=.34;
  g.lineWidth=18-i;
  g.beginPath();
  g.ellipse(0,yy,rx,38,rotation+i*.13,0.2,Math.PI*1.48);
  g.stroke();
 }
 g.globalAlpha=.5;
 g.fillStyle='#263740';
 g.beginPath();
 g.ellipse(95,32,125,160,.1,0,Math.PI*2);
 g.fill();
 g.globalAlpha=.52;
 g.strokeStyle='#68777e';
 g.lineWidth=17;
 g.beginPath();
 g.arc(-50,-25,175,.18,2.28);
 g.stroke();
 puff(-5,14,130,50,.88,false);
 puff(-78,7,88,35,.68,false);
 for(let i=0;i<7;i++){
  g.globalAlpha=.4;
  g.strokeStyle='#87969c';
  g.lineWidth=3;
  g.beginPath();
  g.arc(-8,6,52+i*15,.18+i*.12,Math.PI*1.25+i*.12);
  g.stroke();
 }
 g.globalAlpha=.85;
 g.fillStyle='#202c32';
 g.beginPath();
 g.moveTo(-32,35);
 g.bezierCurveTo(-58,80,-34,120,-14,156);
 g.bezierCurveTo(-2,178,17,178,31,153);
 g.bezierCurveTo(43,113,54,78,25,35);
 g.closePath();
 g.fill();
 g.globalAlpha=.3;
 g.fillStyle='#b7c2c5';
 g.beginPath();
 g.ellipse(5,158,62,17,0,0,Math.PI*2);
 g.fill();
 g.restore();
}

function lightning(x,y){
 g.save();
 g.strokeStyle='#effaff';
 g.shadowBlur=30;
 g.shadowColor='#bde8ff';
 g.lineWidth=3;
 g.beginPath();
 g.moveTo(x,y);
 for(let i=0;i<6;i++){
  g.lineTo(x+(Math.random()-.5)*45,y+i*27);
 }
 g.stroke();
 g.restore();
}

function drawWorld(){
 const W=world.width;
 const H=world.height;
 const sky=g.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#030912');
 sky.addColorStop(.38,'#101f2b');
 sky.addColorStop(.72,'#59676e');
 sky.addColorStop(1,'#26382b');
 g.fillStyle=sky;
 g.fillRect(0,0,W,H);
 const sx=W*.70;
 const sy=H*.34;
 for(let i=0;i<24;i++){
  const x=(i*197+t*4)%(W+500)-250;
  puff(x,90+(i%6)*45,110+(i%4)*35,36+(i%3)*12,.13,false);
 }
 drawSupercell(sx,sy);
 if(Math.random()<.018){flash=5;}
 if(flash>0){
  flash--;
  g.fillStyle='rgba(220,242,255,.13)';
  g.fillRect(0,0,W,H);
  lightning(sx+Math.sin(t*4)*100,sy+20);
 }
 g.save();
 g.globalAlpha=.16;
 g.strokeStyle='#9eb3bc';
 for(let i=0;i<100;i++){
  const x=sx-150+i*3;
  g.beginPath();
  g.moveTo(x,sy+45);
  g.lineTo(x-20,sy+H*.34);
  g.stroke();
 }
 g.restore();
 g.fillStyle='#29492e';
 g.fillRect(0,H*.73,W,H*.27);
 rotation+=.018;
 t+=.016;
 requestAnimationFrame(drawWorld);
}

drawWorld();

function radar(){
 const W=360;
 const H=360;
 const cx=180;
 const cy=180;
 const image=r.createImageData(W,H);
 for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){
   const dx=(x-cx)/180;
   const dy=(y-cy)/180;
   let v=0;
   const cells=[{x:.40,y:.32,s:.24},{x:.05,y:.42,s:.13},{x:.55,y:.55,s:.10}];
   for(const cell of cells){
    const q=Math.hypot(dx-(cell.x*2-1),dy-(cell.y*2-1));
    v=Math.max(v,Math.exp(-q*q/(cell.s*1.3))*85);
   }
   let rr=0,gg=0,bb=0;
   if(product==='ref'){
    if(v<15){bb=v*6;}
    else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3;}
    else if(v<55){gg=220;rr=(v-35)*5;}
    else if(v<70){rr=240;gg=130-(v-55)*5;}
    else{rr=255;gg=45;bb=20;}
   }else{
    const signed=((x-cx)*.9-(y-cy)*.55+Math.sin(t*4)*18)*v/50;
    const a=Math.min(1,Math.abs(signed)/60);
    if(signed<0){bb=230*a;gg=130*a;}
    else{rr=235*a;gg=80*a;bb=45*a;}
   }
   const i=(y*W+x)*4;
   image.data[i]=rr;
   image.data[i+1]=gg;
   image.data[i+2]=bb;
   image.data[i+3]=255;
  }
 }
 r.putImageData(image,0,0);
 r.strokeStyle='rgba(255,255,255,.35)';
 for(let q=45;q<=135;q+=45){r.beginPath();r.arc(cx,cy,q,0,Math.PI*2);r.stroke();}
 r.beginPath();r.moveTo(cx,0);r.lineTo(cx,H);r.moveTo(0,cy);r.lineTo(W,cy);r.stroke();
 r.fillStyle='#fff';
 r.beginPath();r.arc(cx,cy,4,0,Math.PI*2);r.fill();
}

function setProduct(p){
 product=p;
 document.getElementById('refBtn').classList.toggle('active',p==='ref');
 document.getElementById('velBtn').classList.toggle('active',p==='vel');
 document.getElementById('productText').textContent=p==='ref'?'NEXRAD simulé · réflectivité Z · balayage 0.5°':'NEXRAD simulé · vélocité radiale VEL · balayage 0.5°';
 document.getElementById('minL').textContent=p==='ref'?'5 dBZ':'-60 kt';
 document.getElementById('midL').textContent=p==='ref'?'45 dBZ':'0 kt';
 document.getElementById('maxL').textContent=p==='ref'?'70+ dBZ':'+60 kt';
}

document.getElementById('refBtn').addEventListener('click',function(){setProduct('ref');});
document.getElementById('velBtn').addEventListener('click',function(){setProduct('vel');});
document.getElementById('zBtn').addEventListener('click',function(){setProduct('ref');});
document.getElementById('velHot').addEventListener('click',function(){setProduct('vel');});
setInterval(radar,90);

const modal=document.getElementById('modal');
document.getElementById('closeBtn').addEventListener('click',function(){modal.classList.remove('show');});
document.getElementById('stormBtn').addEventListener('click',function(){
 modal.classList.add('show');
 document.getElementById('mt').textContent='🌪️ Supercellule — analyse';
 document.getElementById('mb').innerHTML='<p><b>Structure :</b> supercellule à mésocyclone persistant</p><p><b>Updraft :</b> puissant · <b>Enclume :</b> développée</p><p><b>Wall cloud :</b> visible · <b>Rotation :</b> forte</p><p><b>Précipitations :</b> noyau intense + rideau arrière</p>';
});
document.getElementById('adminBtn').addEventListener('click',function(){
 modal.classList.add('show');
 document.getElementById('mt').textContent='🛠️ Administration';
 document.getElementById('mb').innerHTML='<p>Simulation météo — contrôle administrateur.</p><button id="resetWeather">Réinitialiser la météo</button>';
 document.getElementById('resetWeather').addEventListener('click',function(){location.reload();});
});
window.addEventListener('keydown',function(event){
 if(event.key.toLowerCase()==='z'){document.getElementById('adminBtn').click();}
 if(event.key==='Escape'){modal.classList.remove('show');}
});
radar();
})();
</script>
</body>
</html>
