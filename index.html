<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#eef7ff;font:14px system-ui,Arial,sans-serif}#scene{position:fixed;inset:0}#scene canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:#07111dcc;border:1px solid #4d6678;border-radius:10px;padding:10px 13px;box-shadow:0 8px 30px #0008;backdrop-filter:blur(6px)}.top{display:flex;justify-content:space-between;padding:14px}.title{font-weight:800;font-size:18px}.risk{min-width:270px}.risk b{font-size:18px}.meter{height:8px;background:#243542;border-radius:8px;margin:6px 0;overflow:hidden}.meter i{display:block;height:100%;width:60%;background:#e8ad45}.controls{position:absolute;left:14px;bottom:18px}.hotbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.slot{width:78px;height:65px;background:#091622dd;border:1px solid #536b7d;border-radius:9px;text-align:center;padding:6px;cursor:pointer}.slot:hover,.slot.active{border-color:#8bdcff;background:#122b3b}.key{font-size:10px;color:#9cb1c0}.icon{font-size:23px}.hint{font-size:12px;color:#b9cbd6;margin-top:5px}.modal{position:fixed;inset:0;display:none;place-items:center;background:#0009;pointer-events:auto}.modal.show{display:grid}.window{width:min(850px,92vw);max-height:82vh;overflow:auto;background:#0a1722;border:1px solid #597488;border-radius:14px;padding:18px;box-shadow:0 20px 70px #000}.close{float:right;background:#263d4d;color:#fff;border:0;border-radius:6px;padding:7px 11px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#10212e;border:1px solid #304b5e;border-radius:9px;padding:12px}.admin button,.admin select{width:100%;margin:5px 0;padding:9px;border-radius:6px;border:1px solid #456176;background:#142735;color:#fff}.toast{position:fixed;top:88px;left:50%;transform:translateX(-50%);background:#0b1722ee;border:1px solid #587489;border-radius:8px;padding:10px 15px;display:none}.toast.show{display:block}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.55}.cross:before,.cross:after{content:'';position:absolute;background:white}.cross:before{left:8px;top:0;width:1px;height:18px}.cross:after{left:0;top:8px;width:18px;height:1px}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body><div id="scene"></div><div class="cross"></div>
<div class="hud"><div class="top"><div class="panel"><div class="title">🌪️ STORM CHASER 3D</div><div id="status">Ciel clair · Recherche de cellules</div><div class="hint">WASD : conduire · souris : regarder · E : radar</div></div><div class="panel risk">🛰️ SPC RISK — <b id="riskName">ENHANCED</b><div class="meter"><i id="riskBar"></i></div><small id="riskInfo">Tornade: 10% · Grêle: 30% · Vent: 30%</small></div></div>
<div class="controls panel">🚙 <b>Véhicule</b><br>Vitesse <span id="speed">0</span> km/h<br>Direction <span id="heading">N</span></div>
<div class="hotbar"><div class="slot active" data-open="radar"><div class="key">1</div><div class="icon">📡</div>Radar</div><div class="slot" data-open="map"><div class="key">2</div><div class="icon">🗺️</div>Carte</div><div class="slot" data-open="storms"><div class="key">3</div><div class="icon">🌪️</div>Tempêtes</div><div class="slot" data-open="gear"><div class="key">4</div><div class="icon">🚙</div>Équipement</div><div class="slot" id="adminSlot"><div class="key">Z</div><div class="icon">🛠️</div>Admin</div></div></div>
<div class="modal" id="modal"><div class="window"><button class="close" onclick="closeModal()">Fermer</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const THREE=window.THREE,root=document.getElementById('scene');let scene,camera,renderer,clock;let keys={};let car,stormObjects=[];let speed=0,heading=0;let risk=['MARGINAL','SLIGHT','ENHANCED','MODERATE','HIGH'],ri=2;
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x86a8bd);scene.fog=new THREE.Fog(0x86a8bd,180,700);camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1500);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);clock=new THREE.Clock();
scene.add(new THREE.HemisphereLight(0xcfe7ff,0x304028,1.7));let sun=new THREE.DirectionalLight(0xfff1d0,2.3);sun.position.set(-100,180,80);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),new THREE.MeshStandardMaterial({color:0x4d6545,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<80;i++){let m=new THREE.Mesh(new THREE.ConeGeometry(2+Math.random()*3,8+Math.random()*15,7),new THREE.MeshStandardMaterial({color:0x244b2d}));m.position.set((Math.random()-.5)*900,4,(Math.random()-.5)*900);m.castShadow=true;scene.add(m)}
car=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.1,5.4),new THREE.MeshStandardMaterial({color:0x202a31,metalness:.35,roughness:.5}));body.position.y=1.25;body.castShadow=true;car.add(body);let roof=new THREE.Mesh(new THREE.BoxGeometry(2.5,.65,2.5),new THREE.MeshStandardMaterial({color:0x18232a}));roof.position.set(0,2,0);car.add(roof);for(const x of[-1.45,1.45])for(const z of[-1.7,1.7]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.35,16),new THREE.MeshStandardMaterial({color:0x111}));w.rotation.z=Math.PI/2;w.position.set(x,.65,z);car.add(w)}car.position.set(0,0,30);scene.add(car);spawnStorms();animate()}
function cloudMaterial(){return new THREE.MeshLambertMaterial({color:0xcbd3d5,transparent:true,opacity:.78,depthWrite:false})}
function makeCloud(x,y,z,scale,dark=false){let g=new THREE.Group();for(let i=0;i<18;i++){let s=.8+Math.random()*1.7,m=new THREE.Mesh(new THREE.SphereGeometry(s,12,10),cloudMaterial());m.material.color.setHex(dark?0x657078:0xd3d9da);m.position.set((Math.random()-.5)*8,(Math.random()-.5)*4,(Math.random()-.5)*8);m.scale.set(1.5, .8+Math.random(),1.2);g.add(m)}g.position.set(x,y,z);g.scale.setScalar(scale);g.userData.speed=.5+Math.random()*.7;scene.add(g);return g}
function makeTornado(x,z,strength){let g=new THREE.Group();let mat=new THREE.MeshLambertMaterial({color:0x4e5558,transparent:true,opacity:.72,side:THREE.DoubleSide,depthWrite:false});for(let i=0;i<9;i++){let r=.7+(i*.5)*strength/60,m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.35,3.5,20,1,true),mat);m.position.y=2+i*3.3;m.rotation.y=i*.45;g.add(m)}g.position.set(x,0,z);scene.add(g);return g}
function spawnStorms(){for(let i=0;i<5;i++){let x=(Math.random()-.5)*500,z=-120-Math.random()*400;let cloud=makeCloud(x,80+Math.random()*35,z,5+Math.random()*5,i%2===0);let tornado=null;if(i===1||i===3)tornado=makeTornado(x,z,35+Math.random()*65);stormObjects.push({cloud,tornado,type:i===1?'Supercellule':i===3?'Tornade EF3':'Orage',x,z})}}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}
function update(dt){let accel=(keys.w?1:0)-(keys.s?1:0);speed+=accel*45*dt;if(!accel)speed*=Math.pow(.04,dt);speed=Math.max(-25,Math.min(75,speed));let steer=(keys.a?1:0)-(keys.d?1:0);heading+=steer*speed*.018*dt;car.rotation.y=heading;car.translateZ(-speed*dt*.55);car.position.y=0;camera.position.lerp(new THREE.Vector3(car.position.x+Math.sin(heading)*13,7.5,car.position.z+Math.cos(heading)*13),.08);camera.lookAt(car.position.x,3,car.position.z);document.getElementById('speed').textContent=Math.round(Math.abs(speed));document.getElementById('heading').textContent=['N','NE','E','SE','S','SO','O','NO'][Math.round(((heading%(Math.PI*2)+Math.PI*2)%(Math.PI*2))/(Math.PI/4))%8];for(const s of stormObjects){s.cloud.position.x+=s.cloud.userData.speed*dt;s.cloud.position.z+=s.cloud.userData.speed*.35*dt;if(s.tornado){s.tornado.rotation.y+=dt*1.8;s.tornado.position.x=s.cloud.position.x;s.tornado.position.z=s.cloud.position.z}}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='z')openModal('admin');if(e.key==='Escape')closeModal();if(['1','2','3','4'].includes(e.key))openModal(['radar','map','storms','gear'][+e.key-1]);if(e.key.toLowerCase()==='e')openModal('radar')});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function openModal(kind){let title='',body='';if(kind==='radar'){title='📡 Radar météo';body='<div class="grid"><div class="card">🟢 Faible<br>Précipitations faibles</div><div class="card">🟡 Modérée<br>Cellules à surveiller</div><div class="card">🔴 Forte<br>Convection dangereuse</div></div><p>Le monde 3D affiche les cellules et les nuages directement dans le ciel.</p>'}else if(kind==='map'){title='🗺️ Carte';body='<div class="card">Carte de navigation — les cellules météo sont représentées par leur position et leur déplacement.</div>'}else if(kind==='storms'){title='🌪️ Tempêtes visibles';body='<div class="grid">'+stormObjects.map(s=>`<div class="card"><b>${s.type}</b><br>Position: ${Math.round(s.cloud.position.x)}, ${Math.round(s.cloud.position.z)}<br>${s.tornado?'🌀 Tornade active':'☁️ Nuages convectifs'}</div>`).join('')+'</div>'}else if(kind==='gear'){title='🚙 Équipement';body='<div class="grid"><div class="card">📻 Radio<br>Communication</div><div class="card">📷 Caméra<br>Observation</div><div class="card">🛰️ GPS<br>Localisation</div></div>'}else{title='🛠️ Menu Admin';body='<div class="admin"><div class="card">Interface de contrôle de la simulation.</div><select id="stype"><option>Orage</option><option>Supercellule</option><option>Tornade EF1</option><option>Tornade EF3</option><option>Tornade EF5</option><option>Grêle</option></select><button onclick="adminSpawn()">🌪️ Créer une cellule</button><button onclick="cycleRisk()">🛰️ Changer le SPC Risk</button><button onclick="resetStorms()">🧹 Réinitialiser les tempêtes</button></div>'}document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}function adminSpawn(){let type=document.getElementById('stype').value,x=(Math.random()-.5)*450,z=-120-Math.random()*350,cloud=makeCloud(x,85,z,6,type!=='Orage');let tornado=type.includes('Tornade')?makeTornado(x,z,70):null;stormObjects.push({cloud,tornado,type,x,z});toast('Nouvelle tempête créée');openModal('admin')}function resetStorms(){stormObjects.forEach(s=>{scene.remove(s.cloud);if(s.tornado)scene.remove(s.tornado)});stormObjects=[];spawnStorms();toast('Tempêtes réinitialisées');closeModal()}function cycleRisk(){ri=(ri+1)%risk.length;updateRisk();openModal('admin')}function updateRisk(){document.getElementById('riskName').textContent=risk[ri];document.getElementById('riskBar').style.width=(20+ri*20)+'%';let v=[2,5,10,15,30][ri];document.getElementById('riskInfo').textContent=`Tornade: ${v}% · Grêle: ${Math.min(60,v*3)}% · Vent: ${Math.min(60,v*3)}%`}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}document.querySelectorAll('.slot[data-open]').forEach(e=>e.onclick=()=>openModal(e.dataset.open));document.getElementById('adminSlot').onclick=()=>openModal('admin');updateRisk();init();
</script></body></html>
