<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050b11;color:#edf7fa;font:13px Arial,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;image-rendering:auto}.hud{position:fixed;inset:0;pointer-events:none}.glass{background:rgba(4,10,15,.88);border:1px solid rgba(150,180,190,.25);box-shadow:0 8px 25px rgba(0,0,0,.3)}.top{display:flex;justify-content:space-between;padding:14px}.brand,.risk{padding:10px 14px;border-radius:8px}.brand b{font-size:16px;letter-spacing:.08em}.risk{text-align:right}.risk strong{color:#ffd45a}.radar{position:absolute;left:16px;top:84px;width:330px;padding:9px;border-radius:10px}.radarHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.tabs button,.hotbar button{border:1px solid #48606d;background:#101e27;color:#dcebf0;border-radius:6px;cursor:pointer}.tabs button{padding:5px 8px}.tabs .on{background:#2a5565}.rad{width:300px;height:300px;display:block;border-radius:50%;background:#02070a;border:1px solid #68818c}.radarFoot{display:flex;justify-content:space-between;color:#9fb2ba;font-size:10px;margin-top:5px}.hotbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;padding:7px;border-radius:10px}.hotbar button{width:62px;height:54px;font-size:19px}.hotbar small{font-size:10px}.help{position:absolute;right:14px;bottom:14px;padding:9px 11px;border-radius:8px;color:#b9cbd1}.fps{position:absolute;right:14px;top:70px;padding:6px 9px;border-radius:6px;color:#b9cbd1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(650px,90vw);padding:18px;border-radius:12px}.close{float:right;background:#20343e;color:white;border:0;border-radius:5px;padding:6px 10px}</style></head><body><canvas id="scene"></canvas><div class="hud"><div class="top"><div class="glass brand"><b>STORM CHASER</b><br><span>SUPERCELL · MESOCYCLONE ACTIF</span></div><div class="glass risk">SPC RISK <strong>ENHANCED</strong><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="glass radar"><div class="radarHead"><b>RADAR / NEXRAD</b><div class="tabs"><button id="ref" class="on">REF</button><button id="vel">VEL</button></div></div><canvas id="rad" class="rad" width="300" height="300"></canvas><div class="radarFoot"><span id="l1">5 dBZ</span><span id="l2">45 dBZ</span><span id="l3">70+ dBZ</span><span>LIVE</span></div></div><div class="hotbar glass"><button id="map">🗺️<br><small>MAP</small></button><button id="bz">📡<br><small>REF</small></button><button id="bv">💨<br><small>VEL</small></button><button id="storm">⛈️<br><small>STORM</small></button><button id="admin">⚙️<br><small>ADMIN</small></button></div><div class="glass help">WASD / ZQSD · souris · Shift sprint<br>Espace monter · Ctrl descendre · Échap libérer</div><div id="fps" class="glass fps">FPS --</div></div><div id="modal" class="modal"><div class="glass window"><button class="close" id="close">Fermer</button><h2 id="title"></h2><div id="body"></div></div></div><script>(function(){'use strict';
/* Low-end friendly: fixed 960x540 render buffer, no WebGL, no per-frame sorting, no per-frame gradients. */
var c=document.getElementById('scene'),g=c.getContext('2d',{alpha:false}),rad=document.getElementById('rad'),r=rad.getContext('2d',{alpha:false});var RW=960,RH=540,W=innerWidth,H=innerHeight,t=0,last=performance.now(),frames=0,fpsTime=performance.now(),product='ref',flash=0;var P={x:0,y:1.6,z:9,yaw:0,pitch:-.05},keys={};
c.width=RW;c.height=RH;function resize(){W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
var cloudSprite=document.createElement('canvas'),cs=cloudSprite.getContext('2d'),S=128;cloudSprite.width=cloudSprite.height=S;function makeCloudSprite(){var q=cs.createRadialGradient(64,58,6,64,64,61);q.addColorStop(0,'rgba(205,214,216,.92)');q.addColorStop(.22,'rgba(128,142,147,.88)');q.addColorStop(.52,'rgba(62,74,80,.78)');q.addColorStop(.78,'rgba(20,28,34,.48)');q.addColorStop(1,'rgba(0,0,0,0)');cs.fillStyle=q;cs.fillRect(0,0,S,S)}makeCloudSprite();var stormSprite=document.createElement('canvas'),ss=stormSprite.getContext('2d');stormSprite.width=stormSprite.height=128;var sg=ss.createRadialGradient(64,55,4,64,64,62);sg.addColorStop(0,'rgba(116,126,128,.78)');sg.addColorStop(.45,'rgba(45,52,55,.72)');sg.addColorStop(.78,'rgba(13,18,21,.38)');sg.addColorStop(1,'rgba(0,0,0,0)');ss.fillStyle=sg;ss.fillRect(0,0,128,128);
function noise(x){var n=Math.sin(x*12.9898)*43758.5453;return n-Math.floor(n)}function addCloud(cx,cy,cz,rx,ry,rz,n,seed){for(var i=0;i<n;i++){var a=noise(seed+i*2.1)*6.283,u=noise(seed+i*3.7)*2-1,q=Math.pow(noise(seed+i*5.3),.6),rr=Math.sqrt(1-u*u);cloud.push({x:cx+Math.cos(a)*rr*rx*q,y:cy+u*ry*q,z:cz+Math.sin(a)*rr*rz*q,s:.35+.7*noise(seed+i*7.1),a:.45+.4*(1-q)})}}var cloud=[];addCloud(0,3.0,.2,3.0,1.05,1.7,34,1);addCloud(-2.15,2.85,.25,1.65,.65,1.15,18,2);addCloud(2.05,2.8,.35,1.7,.72,1.2,18,3);addCloud(-.25,4.05,.1,4.35,.72,2.05,34,4);addCloud(-3.25,3.55,.1,1.55,.48,1,12,5);addCloud(.1,4.8,.2,2.2,.7,1.2,18,6);
function project(x,y,z){var dx=x-P.x,dy=y-P.y,dz=z-P.z,co=Math.cos(P.yaw),si=Math.sin(P.yaw),X=dx*co-dz*si,Z=dx*si+dz*co,cp=Math.cos(P.pitch),sp=Math.sin(P.pitch),Y=dy*cp-Z*sp;Z=dy*sp+Z*cp;if(Z<.3)return null;var f=460;return{x:480+X*f/Z,y:270-Y*f/Z,s:f/Z,z:Z}}
function sky(){g.fillStyle='#050d16';g.fillRect(0,0,RW,RH);var grd=g.createLinearGradient(0,0,0,RH);grd.addColorStop(0,'#02070d');grd.addColorStop(.38,'#0b1720');grd.addColorStop(.62,'#39484f');grd.addColorStop(.78,'#65706f');grd.addColorStop(1,'#25372b');g.fillStyle=grd;g.fillRect(0,0,RW,RH)}
function ground(){g.fillStyle='#1c3024';g.fillRect(0,390,RW,150);g.fillStyle='rgba(145,155,135,.16)';g.fillRect(0,378,RW,12);for(var i=0;i<18;i++){var x=(i*83+t*2)%RW;g.strokeStyle='rgba(70,105,63,.32)';g.beginPath();g.moveTo(x,420+(i%4)*22);g.lineTo(x+(i%3-1)*4,405+(i%4)*22);g.stroke()}}
function puff(p,size,a,kind){var s=p.s*size;if(s<1)return;g.globalAlpha=a;g.drawImage(kind===1?stormSprite:cloudSprite,p.x-s,p.y-s,s*2,s*2)}
function storm(){var i,o,p,u,a,rr;g.globalAlpha=1;for(i=0;i<cloud.length;i++){o=cloud[i];p=project(o.x,o.y,o.z);if(p)puff(p,5.8*(1+Math.max(0,o.y-2)*.055),o.a*(o.y>3.7?1.12:.82),o.y<2.65?1:0)}/* sculpted shelf and dark rain core */p=project(.35,2.15,.15);if(p){g.globalAlpha=.72;g.fillStyle='#182126';g.beginPath();g.ellipse(p.x,p.y,p.s*1.45,p.s*.42,0,0,6.283);g.fill()}p=project(.55,2.55,.2);if(p){g.globalAlpha=.48;g.fillStyle='#263137';g.beginPath();g.ellipse(p.x,p.y,p.s*1.15,p.s*.72,0,0,6.283);g.fill()}/* rotating wall cloud */for(i=0;i<16;i++){u=i/16;a=u*6.283+t*.45;rr=.28+.42*u;p=project(-.38+Math.cos(a)*rr,.95+.12*Math.sin(u*3),.18+Math.sin(a)*rr);if(p)puff(p,2.8+2*(1-u),.16+.09*(1-u),1)}/* tornado core: layered tapered smoke puffs */for(i=0;i<22;i++){u=i/21;a=noise(i*2.8)*6.283+t*(1.05-u*.3);rr=(.04+.36*u*u)*(1+.18*Math.sin(t*2+i));p=project(-.35+Math.cos(a)*rr,.28+u*1.72,.2+Math.sin(a)*rr);if(p)puff(p,2.15+2.1*u,.22+.12*(1-u),1)}/* second distant tornado */for(i=0;i<11;i++){u=i/10;a=noise(i*4.1)*6.283+t*.65;rr=.08+.2*u*u;p=project(2.45+Math.cos(a)*rr,.35+u*1.5,.75+Math.sin(a)*rr);if(p)puff(p,1.5+1.3*u,.12+.07*(1-u),1)}/* ground debris */for(i=0;i<18;i++){u=noise(i*7.7);a=noise(i*3.1)*6.283+t*1.3;rr=.18+.65*u;p=project(-.35+Math.cos(a)*rr,.12+.08*u,.2+Math.sin(a)*rr);if(p){g.globalAlpha=.25;g.fillStyle='#554b3f';g.fillRect(p.x,p.y,Math.max(1,p.s*.025),Math.max(1,p.s*.025))}}g.globalAlpha=1}
function rain(){g.strokeStyle='rgba(190,210,215,.13)';g.lineWidth=1;for(var i=0;i<22;i++){var a=noise(i*8)*6.283,rr=.25+.9*noise(i*4),y=.25+((i*37+t*2.4)%150)/58,p=project(.9+Math.cos(a)*rr,y,.25+Math.sin(a)*rr);if(p){g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-1.2,p.y+5);g.stroke()}}/* dense precipitation curtain under the rear flank */g.strokeStyle='rgba(150,180,188,.075)';for(i=0;i<8;i++){var xx=-1.1+i*.35;var a2=project(xx,.3,.3),b2=project(xx,.3,2.2);if(a2&&b2){g.beginPath();g.moveTo(a2.x,a2.y);g.lineTo(b2.x,b2.y);g.stroke()}}}
function lightning(){if(Math.random()>.002)return;flash=3;var p=project((Math.random()-.5)*1.4,4.1,.2);if(!p)return;g.strokeStyle='rgba(240,250,255,.95)';g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);for(var i=0;i<6;i++)g.lineTo(p.x+(Math.random()-.5)*24,p.y+i*17);g.stroke()}
function move(dt){var f=(keys.w||keys.z?1:0)-(keys.s?1:0),q=(keys.d?1:0)-(keys.a||keys.q?1:0),n=Math.hypot(f,q)||1,sp=keys.shift?6:3;f/=n;q/=n;var co=Math.cos(P.yaw),si=Math.sin(P.yaw);P.x+=(si*f+co*q)*sp*dt;P.z+=(-co*f+si*q)*sp*dt;if(keys[' '])P.y+=sp*dt;if(keys.control)P.y-=sp*dt;P.y=Math.max(.45,Math.min(8,P.y))}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;move(dt);t+=dt;sky();ground();storm();rain();lightning();if(flash){g.fillStyle='rgba(225,242,255,.08)';g.fillRect(0,0,RW,RH);flash--}frames++;if(now-fpsTime>1000){document.getElementById('fps').textContent='FPS '+frames;frames=0;fpsTime=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);
var radarTimer=0;function radar(){var N=300,cx=150,cy=150,im=r.createImageData(N,N),cells=[[-.24,-.32,.24,1],[.18,-.05,.15,.72],[.48,.3,.1,.52],[-.48,.28,.12,.4]];for(var y=0;y<N;y++){for(var x=0;x<N;x++){var dx=(x-cx)/N*2,dy=(y-cy)/N*2,rr=Math.hypot(dx,dy),v=0;for(var k=0;k<4;k++){var cc=cells[k],dd=Math.hypot(dx-cc[0],dy-cc[1]);v=Math.max(v,Math.exp(-dd*dd/(cc[2]*cc[2]))*85*cc[3])}var R=0,G=0,B=0;if(rr>1){R=3;G=7;B=9}else if(product==='ref'){if(v<12)B=35+v*5;else if(v<30){G=70+(v-12)*5;B=110-(v-12)*3}else if(v<50){G=210;R=(v-30)*5}else if(v<65){R=245;G=145-(v-50)*6}else{R=255;G=45;B=15}}else{var vel=(dx*.9-dy*.75+Math.sin(t*2.8)*.05)*v*1.2,A=Math.min(1,Math.abs(vel)/55);if(vel<0){B=225*A;G=120*A}else{R=235*A;G=70*A;B=35*A}}var n=(y*N+x)*4;im.data[n]=R;im.data[n+1]=G;im.data[n+2]=B;im.data[n+3]=255}}r.putImageData(im,0,0);r.strokeStyle='rgba(210,235,240,.28)';for(var q=50;q<=120;q+=35){r.beginPath();r.arc(cx,cy,q,0,6.283);r.stroke()}var sweep=t*1.5;r.strokeStyle='rgba(190,245,255,.5)';r.beginPath();r.moveTo(cx,cy);r.lineTo(cx+Math.cos(sweep)*145,cy+Math.sin(sweep)*145);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,3,0,6.283);r.fill()}function setProduct(p){product=p;document.getElementById('ref').classList.toggle('on',p==='ref');document.getElementById('vel').classList.toggle('on',p==='vel');document.getElementById('l1').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('l2').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('l3').textContent=p==='ref'?'70+ dBZ':'+60 kt'}document.getElementById('ref').onclick=function(){setProduct('ref')};document.getElementById('vel').onclick=function(){setProduct('vel')};document.getElementById('bz').onclick=function(){setProduct('ref')};document.getElementById('bv').onclick=function(){setProduct('vel')};radar();setInterval(radar,600);var modal=document.getElementById('modal');function openStorm(){modal.classList.add('show');document.getElementById('title').textContent='⛈️ Analyse supercellule';document.getElementById('body').innerHTML='<p>Supercellule active · mésocyclone simulé</p><p>Réflectivité forte · rotation détectée · précipitations intenses</p>'}function openAdmin(){modal.classList.add('show');document.getElementById('title').textContent='⚙️ Administration';document.getElementById('body').innerHTML='<p>Contrôles de simulation.</p><button id="reset">Réinitialiser</button>';document.getElementById('reset').onclick=function(){location.reload()}}document.getElementById('storm').onclick=openStorm;document.getElementById('admin').onclick=openAdmin;document.getElementById('close').onclick=function(){modal.classList.remove('show')};document.getElementById('map').onclick=openStorm;addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='z'&&!e.target.matches('button,input'))openAdmin()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});c.onclick=function(){if(c.requestPointerLock)c.requestPointerLock()};document.addEventListener('mousemove',function(e){if(document.pointerLockElement===c){P.yaw-=e.movementX*.002;P.pitch-=e.movementY*.0015;P.pitch=Math.max(-1.15,Math.min(1.15,P.pitch))}})})();</script></body></html>
