<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser</title><link rel="icon" href="data:,"><style>html,body{margin:0;height:100%;overflow:hidden;background:#07111a;color:#eef8ff;font:14px Arial,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(4,12,20,.84);border:1px solid #4b6577;border-radius:10px;padding:10px;backdrop-filter:blur(7px);pointer-events:auto;box-shadow:0 8px 28px #0008}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;border-radius:50%;border:1px solid #527080;background:#02080c}.tabs{display:flex;gap:5px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.help{position:absolute;right:14px;bottom:14px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right;background:#263c4b;color:#fff;border:0;border-radius:6px;padding:6px 10px}</style></head><body><canvas id="scene"></canvas><div class="hud"><div class="top"><div class="panel"><b>🌩️ STORM CHASER</b><br><span>Supercellule · mésocyclone actif</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="ref" class="active">Réflectivité</button><button id="vel">Vélocité</button></div><canvas id="rad" class="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="lo">5 dBZ</span><span id="mi">45 dBZ</span><span id="hi">70+ dBZ</span></div></div><div class="bottom"><button id="bz">📡<br><small>Z</small></button><button id="bv">💨<br><small>VEL</small></button><button id="bs">🌪️<br><small>Storm</small></button><button id="ba">🛠️<br><small>Admin</small></button></div><div class="help panel">🎮 <b>WASD / ZQSD</b> · souris · Shift courir<br>Espace / Ctrl altitude</div></div><div id="modal" class="modal"><div class="window"><button class="close" id="close">Fermer</button><h2 id="title"></h2><div id="body"></div></div></div><script>
(function(){'use strict';
var c=document.getElementById('scene'),g=c.getContext('2d'),W=innerWidth,H=innerHeight,D=1;var P={x:0,y:1.7,z:10,yaw:0,pitch:-.05};var keys={},t=0,last=performance.now(),flash=0,product='ref';
function resize(){D=Math.min(2,devicePixelRatio||1);c.width=innerWidth*D;c.height=innerHeight*D;g.setTransform(D,0,0,D,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function project(x,y,z){var dx=x-P.x,dy=y-P.y,dz=z-P.z,co=Math.cos(P.yaw),si=Math.sin(P.yaw),X=dx*co-dz*si,Z=dx*si+dz*co,cp=Math.cos(P.pitch),sp=Math.sin(P.pitch),Y=dy*cp-Z*sp;Z=dy*sp+Z*cp;if(Z<=.15)return null;var f=Math.min(W,H)*.9;return{x:W/2+X*f/Z,y:H/2-Y*f/Z,s:f/Z,z:Z}}
function cloudBlob(p,size,alpha,light){var r=Math.max(2,p.s*size),q=g.createRadialGradient(p.x-r*.28,p.y-r*.3,0,p.x,p.y,r);if(light){q.addColorStop(0,'rgba(205,215,218,'+alpha+')');q.addColorStop(.3,'rgba(105,117,122,'+alpha*.8+')');q.addColorStop(.7,'rgba(45,55,60,'+alpha*.55+')')}else{q.addColorStop(0,'rgba(67,77,82,'+alpha+')');q.addColorStop(.42,'rgba(31,39,44,'+alpha*.78+')');q.addColorStop(.8,'rgba(12,19,24,'+alpha*.4+')')}q.addColorStop(1,'rgba(2,7,12,0)');g.fillStyle=q;g.beginPath();g.arc(p.x,p.y,r,0,Math.PI*2);g.fill()}
function puffField(cx,cy,cz,rx,ry,rz,count,seed){var out=[],s=seed;function rnd(){s=(s*1664525+1013904223)>>>0;return s/4294967296}for(var i=0;i<count;i++){var a=rnd()*Math.PI*2,u=rnd()*2-1,v=Math.pow(rnd(),.55),rr=Math.sqrt(1-u*u);out.push({x:cx+Math.cos(a)*rr*rx*v,y:cy+u*ry*v,z:cz+Math.sin(a)*rr*rz*v,r:.08+.22*rnd(),a:.18+.38*(1-v)})}return out}
var clouds=[];clouds=clouds.concat(puffField(0,3.0,0,2.6,.9,1.6,300,1));clouds=clouds.concat(puffField(-1.8,2.55,.15,1.7,.7,1.25,180,2));clouds=clouds.concat(puffField(1.6,2.45,.25,1.6,.8,1.2,170,3));clouds=clouds.concat(puffField(-.2,4.0,.05,4.2,.7,1.8,330,4));clouds=clouds.concat(puffField(-2.7,3.55,.2,1.4,.5,1,120,5));
var funnel=[];for(var i=0;i<240;i++){var u=Math.random(),a=Math.random()*Math.PI*2;funnel.push({u:u,a:a,r:(.08+.56*u*u)*(0.75+.25*Math.random())})}
function drawSky(){var sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#020811');sky.addColorStop(.35,'#0a1a25');sky.addColorStop(.62,'#33464f');sky.addColorStop(.78,'#7b8585');sky.addColorStop(1,'#253528');g.fillStyle=sky;g.fillRect(0,0,W,H);var glow=g.createRadialGradient(W*.62,H*.25,0,W*.62,H*.25,260);glow.addColorStop(0,'rgba(150,170,177,.15)');glow.addColorStop(1,'rgba(150,170,177,0)');g.fillStyle=glow;g.fillRect(0,0,W,H)}
function drawGround(){var grd=g.createLinearGradient(0,H*.7,0,H);grd.addColorStop(0,'#526052');grd.addColorStop(1,'#17271b');g.fillStyle=grd;g.fillRect(0,H*.7,W,H*.3);for(var i=0;i<55;i++){var x=((i*91-P.x*18)%W+W)%W,y=H*.71+(i%8)*20;g.strokeStyle='rgba(24,47,27,.35)';g.beginPath();g.moveTo(x,y);g.lineTo(x+(i%3-1)*5,y-8-(i%4)*4);g.stroke()}}
function drawStorm(){var a=clouds.slice();a.sort(function(A,B){return B.z-A.z});for(var i=0;i<a.length;i++){var o=a[i],p=project(o.x,o.y,o.z);if(p)cloudBlob(p,o.r*5.5,o.a,o.y>3.55)}/* shadowed rain core */var rp=project(1.35,2.0,.35);if(rp){var rg=g.createRadialGradient(rp.x,rp.y,0,rp.x,rp.y,rp.s*1.8);rg.addColorStop(0,'rgba(10,17,22,.48)');rg.addColorStop(1,'rgba(10,17,22,0)');g.fillStyle=rg;g.beginPath();g.ellipse(rp.x,rp.y,rp.s*1.2,rp.s*1.5,0,0,Math.PI*2);g.fill()}
for(i=0;i<funnel.length;i++){var o2=funnel[i],ang=o2.a+t*(1.1+o2.u*.7),rad=o2.r,x=Math.cos(ang)*rad-.1,z=Math.sin(ang)*rad+.2,y=.18+o2.u*1.95,p=project(x,y,z);if(p)cloudBlob(p,2.5+3*(1-o2.u),.09+.14*(1-o2.u),false)}var bp=project(-.1,.03,.2);if(bp){g.fillStyle='rgba(151,139,119,.16)';g.beginPath();g.ellipse(bp.x,bp.y,bp.s*.42,bp.s*.1,0,0,Math.PI*2);g.fill()}}
function drawRain(){for(var i=0;i<85;i++){var ang=i*.73+t*.04,rr=.45+(i%20)/10,yy=.25+((i*31+t*2)%320)/100,p=project(Math.cos(ang)*rr,yy,Math.sin(ang)*rr+.25);if(!p)continue;g.strokeStyle='rgba(180,200,207,.10)';g.lineWidth=1;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-1,p.y+7+p.s*.02);g.stroke()}}
function lightning(){if(Math.random()>.0035)return;flash=5;var p=project((Math.random()-.5)*1.5,4.05,.1);if(!p)return;g.save();g.strokeStyle='rgba(240,250,255,.95)';g.shadowBlur=28;g.shadowColor='rgba(190,225,255,.95)';g.lineWidth=2.5;g.beginPath();g.moveTo(p.x,p.y);for(var i=0;i<7;i++)g.lineTo(p.x+(Math.random()-.5)*32,p.y+i*24);g.stroke();g.restore()}
function move(dt){var f=(keys.w||keys.z?1:0)-(keys.s?1:0),q=(keys.d?1:0)-(keys.a||keys.q?1:0),n=Math.hypot(f,q)||1,sp=keys.shift?6.5:3.2;f/=n;q/=n;var co=Math.cos(P.yaw),si=Math.sin(P.yaw);P.x+=(si*f+co*q)*sp*dt;P.z+=(-co*f+si*q)*sp*dt;if(keys[' '])P.y+=sp*dt;if(keys.control)P.y-=sp*dt;P.y=Math.max(.4,Math.min(12,P.y))}
function frame(ms){var dt=Math.min(.04,(ms-last)/1000);last=ms;move(dt);t+=dt;drawSky();drawGround();drawStorm();drawRain();lightning();if(flash){g.fillStyle='rgba(225,242,255,.08)';g.fillRect(0,0,W,H);flash--}requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='z'&&document.activeElement.tagName!=='BUTTON')openAdmin()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});c.onclick=function(){if(c.requestPointerLock)c.requestPointerLock()};document.addEventListener('mousemove',function(e){if(document.pointerLockElement===c){P.yaw-=e.movementX*.002;P.pitch-=e.movementY*.0015;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch))}});
var rad=document.getElementById('rad'),r=rad.getContext('2d');function radar(){var im=r.createImageData(360,360),cx=180,cy=180;for(var y=0;y<360;y++)for(var xx=0;xx<360;xx++){var dx=(xx-cx)/180,dy=(y-cy)/180,v=0,ps=[[-.25,-.35,.22,1],[.28,-.05,.14,.7],[.52,.35,.1,.55]];for(var k=0;k<ps.length;k++){var pp=ps[k],qq=Math.hypot(dx-pp[0],dy-pp[1]);v=Math.max(v,Math.exp(-qq*qq/(pp[2]*1.2))*85*pp[3])}var rr=0,gg=0,bb=0;if(product==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{var vel=((xx-cx)*.9-(y-cy)*.55+Math.sin(t*4)*18)*v/50,A=Math.min(1,Math.abs(vel)/60);if(vel<0){bb=230*A;gg=130*A}else{rr=235*A;gg=80*A;bb=45*A}}var n=(y*360+xx)*4;im.data[n]=rr;im.data[n+1]=gg;im.data[n+2]=bb;im.data[n+3]=255}r.putImageData(im,0,0);r.strokeStyle='rgba(255,255,255,.22)';for(var q2=60;q2<=150;q2+=45){r.beginPath();r.arc(180,180,q2,0,Math.PI*2);r.stroke()}}
function setProduct(p){product=p;document.getElementById('ref').classList.toggle('active',p==='ref');document.getElementById('vel').classList.toggle('active',p==='vel');document.getElementById('lo').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('mi').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('hi').textContent=p==='ref'?'70+ dBZ':'+60 kt'}document.getElementById('ref').onclick=function(){setProduct('ref')};document.getElementById('vel').onclick=function(){setProduct('vel')};document.getElementById('bz').onclick=function(){setProduct('ref')};document.getElementById('bv').onclick=function(){setProduct('vel')};setInterval(radar,150);radar();
var modal=document.getElementById('modal');function stormInfo(){modal.classList.add('show');document.getElementById('title').textContent='🌪️ Supercellule';document.getElementById('body').innerHTML='<p>Structure volumétrique procédurale : updraft, enclume, wall cloud, noyau de précipitations et funnel.</p><p>Explore la scène avec <b>WASD/ZQSD + souris</b>.</p>'}function openAdmin(){modal.classList.add('show');document.getElementById('title').textContent='🛠️ Administration';document.getElementById('body').innerHTML='<p>Rendu logiciel Canvas : aucun WebGL et aucun CDN.</p><button id="reset">Réinitialiser</button>';document.getElementById('reset').onclick=function(){P.x=0;P.y=1.7;P.z=10;P.yaw=0;P.pitch=-.05;modal.classList.remove('show')}}document.getElementById('bs').onclick=stormInfo;document.getElementById('ba').onclick=openAdmin;document.getElementById('close').onclick=function(){modal.classList.remove('show')};})();
</script></body></html>
