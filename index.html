<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050b11;color:#edf7fa;font:13px Arial,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}.hud{position:fixed;inset:0;pointer-events:none}.glass{background:rgba(4,10,15,.82);border:1px solid rgba(150,180,190,.25);box-shadow:0 8px 25px rgba(0,0,0,.3);backdrop-filter:blur(6px)}.top{display:flex;justify-content:space-between;padding:14px}.brand,.risk{padding:10px 14px;border-radius:8px}.brand b{font-size:16px;letter-spacing:.08em}.risk{text-align:right}.risk strong{color:#ffd45a}.radar{position:absolute;left:16px;top:84px;width:330px;padding:9px;border-radius:10px}.radarHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.tabs button,.hotbar button{border:1px solid #48606d;background:#101e27;color:#dcebf0;border-radius:6px;cursor:pointer}.tabs button{padding:5px 8px}.tabs .on{background:#2a5565}.rad{width:300px;height:300px;display:block;border-radius:50%;background:#02070a;border:1px solid #68818c}.radarFoot{display:flex;justify-content:space-between;color:#9fb2ba;font-size:10px;margin-top:5px}.hotbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;padding:7px;border-radius:10px}.hotbar button{width:62px;height:54px;font-size:19px}.hotbar small{font-size:10px}.help{position:absolute;right:14px;bottom:14px;padding:9px 11px;border-radius:8px;color:#b9cbd1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(650px,90vw);padding:18px;border-radius:12px}.close{float:right;background:#20343e;color:white;border:0;border-radius:5px;padding:6px 10px}</style></head><body><canvas id="scene"></canvas><div class="hud"><div class="top"><div class="glass brand"><b>STORM CHASER</b><br><span>SUPERCELL · MESOCYCLONE ACTIF</span></div><div class="glass risk">SPC RISK <strong>ENHANCED</strong><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="glass radar"><div class="radarHead"><b>RADAR / NEXRAD</b><div class="tabs"><button id="ref" class="on">REF</button><button id="vel">VEL</button></div></div><canvas id="rad" class="rad" width="300" height="300"></canvas><div class="radarFoot"><span id="l1">5 dBZ</span><span id="l2">45 dBZ</span><span id="l3">70+ dBZ</span><span>LIVE</span></div></div><div class="hotbar glass"><button id="map">🗺️<br><small>MAP</small></button><button id="bz">📡<br><small>REF</small></button><button id="bv">💨<br><small>VEL</small></button><button id="storm">⛈️<br><small>STORM</small></button><button id="admin">⚙️<br><small>ADMIN</small></button></div><div class="glass help">WASD / ZQSD · souris · Shift sprint<br>Espace monter · Ctrl descendre · Échap libérer</div></div><div id="modal" class="modal"><div class="glass window"><button class="close" id="close">Fermer</button><h2 id="title"></h2><div id="body"></div></div></div><script>(function(){'use strict';var c=document.getElementById('scene'),g=c.getContext('2d',{alpha:false}),rad=document.getElementById('rad'),r=rad.getContext('2d',{alpha:false});var W=innerWidth,H=innerHeight,D=1,t=0,last=performance.now(),product='ref',flash=0,radarClock=0;var P={x:0,y:1.65,z:9,yaw:0,pitch:-.05},keys={};function resize(){D=Math.min(1.5,devicePixelRatio||1);c.width=Math.floor(innerWidth*D);c.height=Math.floor(innerHeight*D);g.setTransform(D,0,0,D,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();function project(x,y,z){var dx=x-P.x,dy=y-P.y,dz=z-P.z,co=Math.cos(P.yaw),si=Math.sin(P.yaw),X=dx*co-dz*si,Z=dx*si+dz*co,cp=Math.cos(P.pitch),sp=Math.sin(P.pitch),Y=dy*cp-Z*sp;Z=dy*sp+Z*cp;if(Z<.3)return null;var f=Math.min(W,H)*.82;return{x:W/2+X*f/Z,y:H/2-Y*f/Z,s:f/Z,z:Z}}function noise(x){var n=Math.sin(x*12.9898)*43758.5453;return n-Math.floor(n)}var sprite=document.createElement('canvas'),sg=sprite.getContext('2d'),SZ=64; sprite.width=sprite.height=SZ;var grad=sg.createRadialGradient(30,27,2,32,32,31);grad.addColorStop(0,'rgba(105,118,124,.8)');grad.addColorStop(.38,'rgba(45,55,61,.72)');grad.addColorStop(.72,'rgba(16,23,28,.48)');grad.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=grad;sg.fillRect(0,0,SZ,SZ);var cloud=[];function addCloud(cx,cy,cz,rx,ry,rz,n,seed){for(var i=0;i<n;i++){var a=noise(seed+i*2.1)*Math.PI*2,u=noise(seed+i*3.7)*2-1,q=Math.pow(noise(seed+i*5.3),.55),rr=Math.sqrt(1-u*u);cloud.push({x:cx+Math.cos(a)*rr*rx*q,y:cy+u*ry*q,z:cz+Math.sin(a)*rr*rz*q,s:.45+.8*noise(seed+i*7.1),a:.45+.45*(1-q)})}}addCloud(0,3.15,.2,3.1,1.15,1.8,105,1);addCloud(-2.1,3,.25,1.7,.7,1.2,55,2);addCloud(2.1,2.9,.35,1.8,.8,1.3,55,3);addCloud(-.3,4.15,.1,4.2,.7,2,100,4);addCloud(-3.2,3.6,.1,1.5,.5,1,35,5);function drawPuff(p,scale,alpha,bright){var s=p.s*scale;if(s<1)return;g.globalAlpha=alpha;g.drawImage(sprite,p.x-s,p.y-s,s*2,s*2)}function sky(){var s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#02070d');s.addColorStop(.34,'#091722');s.addColorStop(.62,'#263b44');s.addColorStop(.78,'#6c7775');s.addColorStop(1,'#1b291e');g.fillStyle=s;g.fillRect(0,0,W,H);g.fillStyle='rgba(160,190,200,.08)';g.beginPath();g.arc(W*.56,H*.28,150,0,Math.PI*2);g.fill()}function ground(){g.fillStyle='#263a2b';g.fillRect(0,H*.72,W,H*.28);g.fillStyle='rgba(130,140,120,.12)';g.fillRect(0,H*.70,W,H*.025)}function storm(){g.globalCompositeOperation='source-over';var arr=cloud.slice();arr.sort(function(a,b){return b.z-a.z});for(var i=0;i<arr.length;i++){var o=arr[i],p=project(o.x,o.y,o.z);if(p){drawPuff(p,5.2*(1+o.y*.05),o.a*(o.y>3.5?1.15:.8))}}var wp=project(-.35,1.72,.2);if(wp){g.globalAlpha=.7;g.fillStyle='#111b20';g.beginPath();g.ellipse(wp.x,wp.y,wp.s*1.15,wp.s*.38,0,0,Math.PI*2);g.fill()}g.globalAlpha=.8;for(i=0;i<65;i++){var u=noise(i*4.2),a=noise(i*2.8)*Math.PI*2+t*(1+u),rr=.06+.58*u*u,p=project(-.3+Math.cos(a)*rr,.2+u*2.05,.25+Math.sin(a)*rr);if(p)drawPuff(p,2.3+2.5*(1-u),.08+.1*(1-u))}g.globalAlpha=1}function rain(){g.strokeStyle='rgba(180,205,212,.12)';g.lineWidth=1;for(var i=0;i<32;i++){var a=noise(i*8)*Math.PI*2,rr=.5+noise(i*4)*1,y=.4+((i*37+t*2)%180)/80,p=project(1+Math.cos(a)*rr,y,.4+Math.sin(a)*rr);if(p){g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-1,p.y+5);g.stroke()}}}function lightning(){if(Math.random()>.003)return;flash=4;var p=project((Math.random()-.5)*1.5,4.1,.2);if(!p)return;g.strokeStyle='rgba(240,250,255,.95)';g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);for(var i=0;i<7;i++)g.lineTo(p.x+(Math.random()-.5)*30,p.y+i*20);g.stroke()}function move(dt){var f=(keys.w||keys.z?1:0)-(keys.s?1:0),q=(keys.d?1:0)-(keys.a||keys.q?1:0),n=Math.hypot(f,q)||1,sp=keys.shift?6.5:3.2;f/=n;q/=n;var co=Math.cos(P.yaw),si=Math.sin(P.yaw);P.x+=(si*f+co*q)*sp*dt;P.z+=(-co*f+si*q)*sp*dt;if(keys[' '])P.y+=sp*dt;if(keys.control)P.y-=sp*dt;P.y=Math.max(.45,Math.min(10,P.y))}function frame(now){var dt=Math.min(.04,(now-last)/1000);last=now;move(dt);t+=dt;sky();ground();storm();rain();lightning();if(flash){g.fillStyle='rgba(225,242,255,.06)';g.fillRect(0,0,W,H);flash--}requestAnimationFrame(frame)}requestAnimationFrame(frame);function radar(){var N=300,cx=150,cy=150,im=r.createImageData(N,N);for(var y=0;y<N;y++){for(var x=0;x<N;x++){var dx=(x-cx)/N*2,dy=(y-cy)/N*2,rr0=Math.hypot(dx,dy),v=0,cells=[[-.24,-.32,.24,1],[.18,-.05,.15,.72],[.48,.3,.1,.52],[-.48,.28,.12,.4]];for(var k=0;k<4;k++){var cc=cells[k],dd=Math.hypot(dx-cc[0],dy-cc[1]);v=Math.max(v,Math.exp(-dd*dd/(cc[2]*cc[2]))*85*cc[3])}var R=0,G=0,B=0;if(rr0>1){R=3;G=7;B=9}else if(product==='ref'){if(v<12){B=35+v*5;G=v*1.4}else if(v<30){G=70+(v-12)*5;B=110-(v-12)*3}else if(v<50){G=210;R=(v-30)*5}else if(v<65){R=245;G=145-(v-50)*6}else{R=255;G=45;B=15}}else{var vel=((dx)*.9-dy*.75+Math.sin(t*2.8)*.05)*v*1.2,A=Math.min(1,Math.abs(vel)/55);if(vel<0){B=225*A;G=120*A}else{R=235*A;G=70*A;B=35*A}}var n=(y*N+x)*4;im.data[n]=R;im.data[n+1]=G;im.data[n+2]=B;im.data[n+3]=255}}r.putImageData(im,0,0);r.strokeStyle='rgba(210,235,240,.28)';r.lineWidth=1;for(var q=50;q<=120;q+=35){r.beginPath();r.arc(cx,cy,q,0,Math.PI*2);r.stroke()}var sweep=t*1.5;r.strokeStyle='rgba(190,245,255,.5)';r.beginPath();r.moveTo(cx,cy);r.lineTo(cx+Math.cos(sweep)*145,cy+Math.sin(sweep)*145);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,3,0,Math.PI*2);r.fill()}function setProduct(p){product=p;document.getElementById('ref').classList.toggle('on',p==='ref');document.getElementById('vel').classList.toggle('on',p==='vel');document.getElementById('l1').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('l2').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('l3').textContent=p==='ref'?'70+ dBZ':'+60 kt'}document.getElementById('ref').onclick=function(){setProduct('ref')};document.getElementById('vel').onclick=function(){setProduct('vel')};document.getElementById('bz').onclick=function(){setProduct('ref')};document.getElementById('bv').onclick=function(){setProduct('vel')};setInterval(radar,350);radar();var modal=document.getElementById('modal');function openStorm(){modal.classList.add('show');document.getElementById('title').textContent='⛈️ Analyse supercellule';document.getElementById('body').innerHTML='<p>Supercellule active · mésocyclone simulé</p><p>Réflectivité forte · rotation détectée · précipitations intenses</p>'}function openAdmin(){modal.classList.add('show');document.getElementById('title').textContent='⚙️ Administration';document.getElementById('body').innerHTML='<p>Contrôles de simulation.</p><button id="reset">Réinitialiser</button>';document.getElementById('reset').onclick=function(){location.reload()}}document.getElementById('storm').onclick=openStorm;document.getElementById('admin').onclick=openAdmin;document.getElementById('close').onclick=function(){modal.classList.remove('show')};document.getElementById('map').onclick=function(){openStorm()};addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='z'&&!e.target.matches('button,input'))openAdmin()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});c.onclick=function(){if(c.requestPointerLock)c.requestPointerLock()};document.addEventListener('mousemove',function(e){if(document.pointerLockElement===c){P.yaw-=e.movementX*.002;P.pitch-=e.movementY*.0015;P.pitch=Math.max(-1.15,Math.min(1.15,P.pitch))}})})();</script></body></html>
