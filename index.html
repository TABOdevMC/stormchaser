<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser — Supercell</title><style>body{margin:0;overflow:hidden;background:#050b12;color:#eef8ff;font:14px system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:#06101ddd;border:1px solid #506b7d;border-radius:10px;padding:10px;backdrop-filter:blur(6px);pointer-events:auto}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;background:#02080c;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right}</style></head><body><canvas id="world"></canvas><div class="hud"><div class="top"><div class="panel"><b>🌪️ STORM CHASER</b><br><span id="status">Supercellule HP — mésocyclone actif</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" class="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div><small id="productText">NEXRAD simulé · réflectivité Z · balayage 0.5°</small></div><div class="bottom"><button onclick="setProduct('ref')">📡<br><small>Z</small></button><button onclick="setProduct('vel')">💨<br><small>VEL</small></button><button onclick="openStorms()">🌪️<br><small>Storms</small></button><button onclick="openAdmin()">🛠️<br><small>Z</small></button></div></div><div id="modal" class="modal"><div class="window"><button class="close" onclick="modal.classList.remove('show')">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const world=document.getElementById('world'),g=world.getContext('2d'),rc=document.getElementById('radarCanvas'),r=rc.getContext('2d');let t=0,product='ref',flash=0,rotation=0;function resize(){world.width=innerWidth;world.height=innerHeight}addEventListener('resize',resize);resize();
function puff(x,y,rx,ry,a,light=false){g.save();g.globalAlpha=a;let q=g.createRadialGradient(x,y,0,x,y,rx);q.addColorStop(0,light?'#6d7b83':'#050b10');q.addColorStop(.55,light?'#29363d':'#121c23');q.addColorStop(1,'#080f1500');g.fillStyle=q;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();g.restore()}
function drawSupercell(sx,sy){let W=world.width,H=world.height;g.save();g.translate(sx,sy);g.rotate(-.08+Math.sin(t*.12)*.01);/* anvil */puff(-40,-105,210,65,.9);puff(100,-92,180,58,.85);puff(-170,-70,125,48,.7);/* layered rotating updraft */for(let i=0;i<9;i++){let yy=-55+i*13,rx=210-i*12;g.strokeStyle=i%2?'#26343c':'#3b4850';g.globalAlpha=.35;g.lineWidth=18-i;g.beginPath();g.ellipse(0,yy,rx,38,rotation+i*.13,Math.PI*.08,Math.PI*1.45);g.stroke()}/* rain core */g.globalAlpha=.45;g.fillStyle='#31424b';g.beginPath();g.ellipse(90,30,120,155,.12,0,7);g.fill();/* inflow tail */g.globalAlpha=.55;g.strokeStyle='#5b6870';g.lineWidth=18;g.beginPath();g.arc(-40,-30,170,.2,2.25);g.stroke();/* wall cloud */puff(-5,15,125,48,.85);puff(-75,5,85,34,.65);/* rotation bands */for(let i=0;i<6;i++){g.globalAlpha=.38;g.strokeStyle='#819098';g.lineWidth=3;g.beginPath();g.arc(-10,5,55+i*14,Math.PI*.15+i*.12,Math.PI*1.25+i*.12);g.stroke()}/* funnel */g.globalAlpha=.82;g.fillStyle='#202b31';g.beginPath();g.moveTo(-30,35);g.bezierCurveTo(-55,80,-30,120,-12,155);g.bezierCurveTo(0,175,18,175,30,153);g.bezierCurveTo(40,115,55,78,25,35);g.closePath();g.fill();g.globalAlpha=.35;g.fillStyle='#a9b4b7';g.beginPath();g.ellipse(5,158,60,16,0,0,7);g.fill();g.restore()}
function lightning(x,y){g.save();g.strokeStyle='#effaff';g.shadowBlur=30;g.shadowColor='#bde8ff';g.lineWidth=3;g.beginPath();g.moveTo(x,y);for(let i=0;i<6;i++)g.lineTo(x+(Math.random()-.5)*45,y+i*28);g.stroke();g.restore()}
function worldDraw(){let W=world.width,H=world.height;let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#030912');sky.addColorStop(.4,'#101f2b');sky.addColorStop(.72,'#59666d');sky.addColorStop(1,'#26372a');g.fillStyle=sky;g.fillRect(0,0,W,H);let sx=W*.70,sy=H*.34;/* distant cloud deck */for(let i=0;i<25;i++){let x=(i*197+t*4)%(W+500)-250; puff(x,95+(i%6)*45,110+(i%4)*35,35+(i%3)*12,.13)}drawSupercell(sx,sy);if(Math.random()<.018)flash=5;if(flash>0){flash--;g.fillStyle='#d9efff22';g.fillRect(0,0,W,H);lightning(sx+Math.sin(t*4)*100,sy+20)}/* precipitation curtains */g.save();g.globalAlpha=.16;g.strokeStyle='#9eb3bc';for(let i=0;i<100;i++){let x=sx-150+i*3;g.beginPath();g.moveTo(x,sy+45);g.lineTo(x-20,sy+H*.34);g.stroke()}g.restore();g.fillStyle='#29492e';g.fillRect(0,H*.73,W,H*.27);for(let i=0;i<130;i++){let x=(i*137)%W,y=H*.72+(i%10)*15;g.strokeStyle='#183522';g.beginPath();g.moveTo(x,y);g.lineTo(x+(i%3-1)*5,y-28-(i%6)*4);g.stroke()}rotation+=.018;t+=.016;requestAnimationFrame(worldDraw)}worldDraw();
function radar(){let W=360,H=360,cx=180,cy=180,im=r.createImageData(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let dx=(x-cx)/180,dy=(y-cy)/180,v=0;for(const p of [{x:.40,y:.32,s:.24},{x:.05,y:.42,s:.13},{x:.55,y:.55,s:.10}]){let q=Math.hypot(dx-(p.x*2-1),dy-(p.y*2-1));v=Math.max(v,Math.exp(-q*q/(p.s*1.3))*85)}let rr=0,gg=0,bb=0;if(product==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{let signed=((x-cx)*.9-(y-cy)*.55+Math.sin(t*4)*18)*v/50,a=Math.min(1,Math.abs(signed)/60);if(signed<0){bb=230*a;gg=130*a}else{rr=235*a;gg=80*a;bb=45*a}}let i=(y*W+x)*4;im.data[i]=rr;im.data[i+1]=gg;im.data[i+2]=bb;im.data[i+3]=255}r.putImageData(im,0,0);r.strokeStyle='#fff5';for(let q=45;q<=135;q+=45){r.beginPath();r.arc(cx,cy,q,0,7);r.stroke()}r.beginPath();r.moveTo(cx,0);r.lineTo(cx,H);r.moveTo(0,cy);r.lineTo(W,cy);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,4,0,7);r.fill()}function setProduct(p){product=p;refBtn.classList.toggle('active',p==='ref');velBtn.classList.toggle('active',p==='vel');productText.textContent=p==='ref'?'NEXRAD simulé · réflectivité Z · balayage 0.5°':'NEXRAD simulé · vélocité radiale VEL · balayage 0.5°';minL.textContent=p==='ref'?'5 dBZ':'-60 kt';midL.textContent=p==='ref'?'45 dBZ':'0 kt';maxL.textContent=p==='ref'?'70+ dBZ':'+60 kt'}refBtn.onclick=()=>setProduct('ref');velBtn.onclick=()=>setProduct('vel');setInterval(radar,90);function openStorms(){modal.classList.add('show');mt.textContent='🌪️ Supercellule — analyse';mb.innerHTML='<p><b>Structure :</b> supercellule à mésocyclone persistant</p><p><b>Updraft :</b> très puissant · <b>Enclume :</b> développée</p><p><b>Wall cloud :</b> visible · <b>Rotation :</b> forte</p><p><b>Précipitations :</b> noyau intense + rideau arrière</p>}function openAdmin(){modal.classList.add('show');mt.textContent='🛠️ Administration';mb.innerHTML='<p>Simulation météo — contrôle administrateur.</p><button onclick="location.reload()">Réinitialiser la météo</button>'}
</script></body></html>
