<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser — 3D Storm Graphics</title><style>body{margin:0;overflow:hidden;background:#050b12;color:#eef8ff;font:14px system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:#06101bdd;border:1px solid #506b7d;border-radius:10px;padding:10px;backdrop-filter:blur(6px);pointer-events:auto}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;background:#02080c;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right}.risk{font-weight:700}</style></head><body><canvas id="world"></canvas><div class="hud"><div class="top"><div class="panel"><b>🌪️ STORM CHASER</b><br><span id="status">Supercellule intense — rotation détectée</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" class="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div><small id="productText">NEXRAD simulé · réflectivité Z · balayage 0.5°</small></div><div class="bottom"><button onclick="setProduct('ref')">📡<br><small>Z</small></button><button onclick="setProduct('vel')">💨<br><small>VEL</small></button><button onclick="openStorms()">🌪️<br><small>Storms</small></button><button onclick="openAdmin()">🛠️<br><small>Z</small></button></div></div><div id="modal" class="modal"><div class="window"><button class="close" onclick="modal.classList.remove('show')">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const world=document.getElementById('world'),g=world.getContext('2d'),rc=document.getElementById('radarCanvas'),r=rc.getContext('2d');let t=0,product='ref';let lightning=0;const storm={x:.70,y:.39};
function resize(){world.width=innerWidth;world.height=innerHeight}addEventListener('resize',resize);resize();
function cloud(x,y,s,a){g.save();g.globalAlpha=a;g.fillStyle='#111c24';for(let i=0;i<7;i++){g.beginPath();g.ellipse(x+(i-3)*s*.42,y+Math.sin(i)*s*.08,s*(.5+.12*Math.sin(i+2)),s*(.22+.08*Math.cos(i)),0,0,7);g.fill()}g.restore()}
function lightningBolt(x,y){g.save();g.strokeStyle='#e9f7ff';g.shadowBlur=25;g.shadowColor='#c8eaff';g.lineWidth=2.5;g.beginPath();g.moveTo(x,y);g.lineTo(x-15,y+45);g.lineTo(x+2,y+43);g.lineTo(x-18,y+100);g.stroke();g.restore()}
function tornado(x,y,s){g.save();g.translate(x,y);g.globalAlpha=.9;for(let i=0;i<16;i++){let yy=i*s*.055,ww=(1-i/18)*s*.32+4;g.fillStyle=i%2?'#18242b':'#2b3840';g.beginPath();g.ellipse(Math.sin(t*2+i)*s*.025,yy,ww,s*.045,0,0,7);g.fill()}g.globalAlpha=.25;g.fillStyle='#c7d1d4';g.beginPath();g.ellipse(0,s*.43,s*.22,s*.07,0,0,7);g.fill();g.restore()}
function worldDraw(){let W=world.width,H=world.height;let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#050d16');sky.addColorStop(.32,'#182d3b');sky.addColorStop(.66,'#6b7880');sky.addColorStop(1,'#26382b');g.fillStyle=sky;g.fillRect(0,0,W,H);let sun=Math.max(0,1-Math.abs(Math.sin(t*.02)))*.35;g.fillStyle='rgba(210,225,230,'+sun+')';g.beginPath();g.arc(W*.76,H*.18,65,0,7);g.fill();for(let i=0;i<18;i++){let x=((i*211+t*7)%(W+500))-250,y=75+(i%6)*48;cloud(x,y,65+(i%3)*30,.18+(i%4)*.035)}let sx=W*storm.x,sy=H*.34;g.save();g.globalAlpha=.7;let an=g.createRadialGradient(sx,sy,20,sx,sy,260);an.addColorStop(0,'#05080b');an.addColorStop(.55,'#111b22');an.addColorStop(1,'#10182000');g.fillStyle=an;g.beginPath();g.ellipse(sx,sy,280,150,0,0,7);g.fill();g.restore();for(let i=0;i<12;i++)cloud(sx-180+i*34,sy-70+i%3*18,100+(i%4)*25,.32);if(Math.random()<.012)lightning=4;if(lightning>0){lightning--;lightningBolt(sx+Math.sin(t*8)*90,sy+30)}t+=.016;g.fillStyle='#294a2d';g.fillRect(0,H*.73,W,H*.27);for(let i=0;i<100;i++){let x=(i*137)%W,y=H*.70+(i%9)*17;g.strokeStyle='#1d3822';g.beginPath();g.moveTo(x,y);g.lineTo(x+((i%3)-1)*4,y-24-(i%5)*4);g.stroke()}tornado(sx+25,H*.53,170);requestAnimationFrame(worldDraw)}worldDraw();
function radar(){let W=360,H=360,cx=180,cy=180,im=r.createImageData(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let dx=(x-cx)/180,dy=(y-cy)/180,v=0;for(const p of [{x:.7,y:.4,s:.21},{x:.42,y:.65,s:.11}]){let q=Math.hypot(dx-(p.x*2-1),dy-(p.y*2-1));v=Math.max(v,Math.exp(-q*q/(p.s*1.3))*85)}let rr=0,gg=0,bb=0;if(product==='ref'){if(v<15){bb=v*6}else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{let signed=(x-cx)*.9-(y-cy)*.55+Math.sin(t*4)*18;let z=Math.max(-60,Math.min(60,signed*v/50)),a=Math.abs(z)/60;if(z<0){bb=230*a;gg=130*a}else{rr=235*a;gg=80*a;bb=45*a}}let i=(y*W+x)*4;im.data[i]=rr;im.data[i+1]=gg;im.data[i+2]=bb;im.data[i+3]=255}r.putImageData(im,0,0);r.strokeStyle='#fff5';for(let q=45;q<=135;q+=45){r.beginPath();r.arc(cx,cy,q,0,7);r.stroke()}r.beginPath();r.moveTo(cx,0);r.lineTo(cx,H);r.moveTo(0,cy);r.lineTo(W,cy);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,4,0,7);r.fill()}function setProduct(p){product=p;refBtn.classList.toggle('active',p==='ref');velBtn.classList.toggle('active',p==='vel');productText.textContent=p==='ref'?'NEXRAD simulé · réflectivité Z · balayage 0.5°':'NEXRAD simulé · vélocité radiale VEL · balayage 0.5°';minL.textContent=p==='ref'?'5 dBZ':'-60 kt';midL.textContent=p==='ref'?'45 dBZ':'0 kt';maxL.textContent=p==='ref'?'70+ dBZ':'+60 kt'}refBtn.onclick=()=>setProduct('ref');velBtn.onclick=()=>setProduct('vel');setInterval(radar,90);function openStorms(){modal.classList.add('show');mt.textContent='🌪️ Analyse météo';mb.innerHTML='<p><b>Supercellule</b> — mésocyclone simulé</p><p>Réflectivité : <b>67 dBZ</b> · Rotation : <b>forte</b></p><p>Tornade : <b>en formation</b></p><p>Éclairs et rideau de précipitations actifs.</p>}function openAdmin(){modal.classList.add('show');mt.textContent='🛠️ Administration';mb.innerHTML='<p>Simulation météo — contrôle administrateur.</p><button onclick="location.reload()">Réinitialiser la météo</button>'}
</script></body></html>
