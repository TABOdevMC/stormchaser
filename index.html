<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Chaser — 3D Supercell</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b12;color:#eef8ff;font:14px system-ui,Arial}#scene{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(5,13,21,.84);border:1px solid #526a7b;border-radius:10px;padding:10px;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px #0006}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;background:#02080c;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right;background:#263c4b;color:#fff;border:0;border-radius:6px;padding:6px 10px}.badge{color:#9de4ff;font-weight:700}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud">
<div class="top"><div class="panel"><b>🌩️ STORM CHASER</b><br><span id="status">Supercellule HP — mésocyclone actif</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div>
<div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" class="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div><small id="productText">NEXRAD simulé · réflectivité Z · balayage 0.5°</small></div>
<div class="bottom"><button id="zBtn">📡<br><small>Z</small></button><button id="vBtn">💨<br><small>VEL</small></button><button id="stormBtn">🌪️<br><small>Storms</small></button><button id="adminBtn">🛠️<br><small>Admin</small></button></div>
</div>
<div id="modal" class="modal"><div class="window"><button class="close" id="closeBtn">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
var container=document.getElementById('scene');
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x07121b);scene.fog=new THREE.FogExp2(0x263944,.0085);
var camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,3000);camera.position.set(0,65,175);camera.lookAt(0,55,0);
var renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;container.appendChild(renderer.domElement);
var hemi=new THREE.HemisphereLight(0x8faebe,0x101812,1.35);scene.add(hemi);var sun=new THREE.DirectionalLight(0xb8c8ce,1.25);sun.position.set(-120,180,80);scene.add(sun);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),new THREE.MeshStandardMaterial({color:0x203c27,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=0;scene.add(ground);
var road=new THREE.Mesh(new THREE.PlaneGeometry(220,2400),new THREE.MeshStandardMaterial({color:0x182025,roughness:1}));road.rotation.x=-Math.PI/2;road.position.y=.02;scene.add(road);
for(var i=0;i<150;i++){var tree=new THREE.Group();var trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,5,6),new THREE.MeshStandardMaterial({color:0x35291c}));trunk.position.y=2.5;tree.add(trunk);var crown=new THREE.Mesh(new THREE.ConeGeometry(2.6,8,7),new THREE.MeshStandardMaterial({color:0x16351e,roughness:1}));crown.position.y=7;tree.add(crown);tree.position.set((Math.random()-.5)*600,0,(Math.random()-.5)*900);if(Math.abs(tree.position.x)<18)tree.position.x+=35;tree.scale.setScalar(.65+Math.random()*.8);scene.add(tree)}
function mat(color,opacity){return new THREE.MeshLambertMaterial({color:color,transparent:true,opacity:opacity,depthWrite:false})}
var storm=new THREE.Group();storm.position.set(35,0,-75);scene.add(storm);
var cloudMat=mat(0x17242c,.74),darkMat=mat(0x0c151c,.8),lightCloud=mat(0x33434b,.48);
function blob(x,y,z,s,m){var q=new THREE.Mesh(new THREE.SphereGeometry(s,18,12),m||cloudMat);q.position.set(x,y,z);q.scale.y=.58;q.scale.z=1.15;storm.add(q);return q}
// Dense rotating updraft tower
for(var i=0;i<42;i++){var a=i*.77,r=10+(i%8)*2.7,y=42+i*.72;blob(Math.cos(a)*r,y,Math.sin(a)*r*.55,9+(i%5)*1.8,i%4===0?lightCloud:cloudMat)}
// Broad, layered anvil
for(i=0;i<28;i++){a=i*.65;r=25+Math.random()*42;blob((Math.random()-.5)*70,78+Math.random()*18,(Math.random()-.5)*30,13+Math.random()*16,i%5===0?lightCloud:darkMat)}
for(i=0;i<18;i++){blob(-30+i*3,63+(i%3)*4,5+(i%4)*5,11,cloudMat)}
// Wall cloud
for(i=0;i<18;i++){a=i*.45;r=10+Math.random()*18;blob(-2+Math.cos(a)*r*.8,35+(i%5)*1.5,Math.sin(a)*r*.55,7+Math.random()*5,darkMat)}
// Rain curtain as transparent streaks
var rainGeo=new THREE.BufferGeometry(),rainN=1200,rp=new Float32Array(rainN*3);for(i=0;i<rainN;i++){rp[i*3]=-35+Math.random()*75;rp[i*3+1]=5+Math.random()*58;rp[i*3+2]=-15+Math.random()*40}rainGeo.setAttribute('position',new THREE.BufferAttribute(rp,3));var rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0x8da9b5,size:.32,transparent:true,opacity:.42,depthWrite:false}));storm.add(rain);
// Tornado funnel made from stacked transparent rotating rings
var tornado=new THREE.Group();tornado.position.set(-2,0,4);storm.add(tornado);var rings=[];for(i=0;i<32;i++){y=3+i*1.05;r=2.2+(i/32)*7.8;var ring=new THREE.Mesh(new THREE.TorusGeometry(r,.72,8,32),mat(i%3===0?0xb5c0c3:0x56656d,.16));ring.rotation.x=Math.PI/2;ring.position.y=y;rings.push(ring);tornado.add(ring)}
var dust=new THREE.Mesh(new THREE.CylinderGeometry(10,5,2.5,32),mat(0x8a8172,.24));dust.position.y=2;storm.add(dust);
// Lightning flashes
var flashLight=new THREE.PointLight(0xd8efff,0,260);flashLight.position.set(10,55,5);storm.add(flashLight);
function lightning(){flashLight.intensity=35;setTimeout(function(){flashLight.intensity=0},90);setTimeout(function(){flashLight.intensity=20},140);setTimeout(function(){flashLight.intensity=0},190)}
setInterval(function(){if(Math.random()<.65)lightning()},2600);
var clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);var dt=clock.getDelta();storm.rotation.y+=dt*.018;for(var j=0;j<rings.length;j++){rings[j].rotation.z+=dt*(1.8-j*.018);rings[j].scale.x=1+Math.sin(clock.elapsedTime*2+j)*.08}rain.rotation.y+=dt*.04;camera.position.x=Math.sin(clock.elapsedTime*.035)*9;camera.lookAt(storm.position.x,48,storm.position.z);renderer.render(scene,camera)}animate();
window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// Radar
var rc=document.getElementById('radarCanvas'),r=rc.getContext('2d'),product='ref',rt=0;function radar(){var W=360,H=360,cx=180,cy=180,im=r.createImageData(W,H);for(var y=0;y<H;y++)for(var x=0;x<W;x++){var dx=(x-cx)/180,dy=(y-cy)/180,v=0;var ps=[{x:.39,y:.31,s:.24},{x:.08,y:.43,s:.13},{x:.56,y:.55,s:.10}];for(var k=0;k<ps.length;k++){var p=ps[k],q=Math.hypot(dx-(p.x*2-1),dy-(p.y*2-1));v=Math.max(v,Math.exp(-q*q/(p.s*1.3))*85)}var rr=0,gg=0,bb=0;if(product==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{var signed=((x-cx)*.9-(y-cy)*.55+Math.sin(rt*4)*18)*v/50,a=Math.min(1,Math.abs(signed)/60);if(signed<0){bb=230*a;gg=130*a}else{rr=235*a;gg=80*a;bb=45*a}}var n=(y*W+x)*4;im.data[n]=rr;im.data[n+1]=gg;im.data[n+2]=bb;im.data[n+3]=255}r.putImageData(im,0,0);r.strokeStyle='rgba(255,255,255,.32)';for(var q2=45;q2<=135;q2+=45){r.beginPath();r.arc(cx,cy,q2,0,Math.PI*2);r.stroke()}r.beginPath();r.moveTo(cx,0);r.lineTo(cx,H);r.moveTo(0,cy);r.lineTo(W,cy);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,4,0,Math.PI*2);r.fill();rt+=.02}
function setProduct(p){product=p;document.getElementById('refBtn').classList.toggle('active',p==='ref');document.getElementById('velBtn').classList.toggle('active',p==='vel');document.getElementById('productText').textContent=p==='ref'?'NEXRAD simulé · réflectivité Z · balayage 0.5°':'NEXRAD simulé · vélocité radiale VEL · balayage 0.5°';document.getElementById('minL').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('midL').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('maxL').textContent=p==='ref'?'70+ dBZ':'+60 kt'}
document.getElementById('refBtn').onclick=function(){setProduct('ref')};document.getElementById('velBtn').onclick=function(){setProduct('vel')};document.getElementById('zBtn').onclick=function(){setProduct('ref')};document.getElementById('vBtn').onclick=function(){setProduct('vel')};setInterval(radar,100);radar();
var modal=document.getElementById('modal');function openStorms(){modal.classList.add('show');document.getElementById('mt').textContent='🌪️ Supercellule — analyse';document.getElementById('mb').innerHTML='<p><b>Structure :</b> supercellule HP à mésocyclone persistant</p><p><b>Updraft :</b> puissant · <b>Enclume :</b> large et multicouche</p><p><b>Wall cloud :</b> visible · <b>Rotation :</b> forte</p><p><b>Précipitations :</b> noyau intense + rideau arrière</p>'}function openAdmin(){modal.classList.add('show');document.getElementById('mt').textContent='🛠️ Administration';document.getElementById('mb').innerHTML='<p>Simulation météo — contrôle administrateur.</p><button id="resetBtn">Réinitialiser la météo</button>';document.getElementById('resetBtn').onclick=function(){location.reload()}}document.getElementById('stormBtn').onclick=openStorms;document.getElementById('adminBtn').onclick=openAdmin;document.getElementById('closeBtn').onclick=function(){modal.classList.remove('show')};window.addEventListener('keydown',function(e){if(e.key.toLowerCase()==='z')openAdmin();if(e.key==='Escape')modal.classList.remove('show')});
})();
</script>
</body></html>
