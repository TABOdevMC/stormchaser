<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser 3D</title><link rel="icon" href="data:,"><style>html,body{margin:0;height:100%;overflow:hidden;background:#050d14;color:#eef8ff;font:14px system-ui,Arial}#scene{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(4,12,20,.88);border:1px solid #496276;border-radius:10px;padding:10px;backdrop-filter:blur(7px);pointer-events:auto;box-shadow:0 8px 28px #0008}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;background:#02070b;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.help{position:absolute;right:14px;bottom:14px;max-width:250px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right;background:#263c4b;color:#fff;border:0;border-radius:6px;padding:6px 10px}@media(max-width:800px){.radar{transform:scale(.72);transform-origin:top left}.top .panel:last-child,.help{display:none}}</style></head><body><canvas id="scene"></canvas><div class="hud"><div class="top"><div class="panel"><b>🌩️ STORM CHASER 3D</b><br><span>Supercellule · mésocyclone actif</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div><small id="productText">Radar simulé · Z · balayage 0.5°</small></div><div class="bottom"><button id="zBtn">📡<br><small>Z</small></button><button id="vBtn">💨<br><small>VEL</small></button><button id="stormBtn">🌪️<br><small>Storm</small></button><button id="adminBtn">🛠️<br><small>Admin</small></button></div><div class="help panel">🎮 <b>Exploration</b><br>WASD / ZQSD · souris · Shift courir<br>Espace / Ctrl altitude<br><small>Clique dans la scène pour regarder autour</small></div></div><div id="modal" class="modal"><div class="window"><button class="close" id="closeBtn">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>(function(){'use strict';var c=document.getElementById('scene'),x=c.getContext('2d'),W=innerWidth,H=innerHeight,D=1,keys={},lock=false,now=0,last=performance.now();var P={x:0,y:1.7,z:9,yaw:0,pitch:-.08};function resize(){D=Math.min(2,devicePixelRatio||1);c.width=innerWidth*D;c.height=innerHeight*D;x.setTransform(D,0,0,D,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='z'&&!lock)admin()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});c.onclick=function(){if(c.requestPointerLock)c.requestPointerLock()};document.addEventListener('pointerlockchange',function(){lock=document.pointerLockElement===c});document.addEventListener('mousemove',function(e){if(lock){P.yaw-=e.movementX*.0021;P.pitch-=e.movementY*.0017;P.pitch=Math.max(-1.25,Math.min(1.25,P.pitch))}});
function move(dt){var f=(keys.w||keys.z?1:0)-(keys.s?1:0),q=(keys.d?1:0)-(keys.a||keys.q?1:0),n=Math.hypot(f,q)||1,sp=keys.shift?6.5:3.2;f/=n;q/=n;var cy=Math.cos(P.yaw),sy=Math.sin(P.yaw);P.x+=(sy*f+cy*q)*sp*dt;P.z+=(-cy*f+sy*q)*sp*dt;if(keys[' '])P.y+=sp*dt;if(keys.control)P.y-=sp*dt;P.y=Math.max(.5,Math.min(12,P.y))}
function proj(X,Y,Z){var dx=X-P.x,dy=Y-P.y,dz=Z-P.z,cy=Math.cos(P.yaw),sy=Math.sin(P.yaw),cx=cy*dx-sy*dz,cz=sy*dx+cy*dz,cp=Math.cos(P.pitch),sp=Math.sin(P.pitch),yy=cp*dy-sp*cz,zz=sp*dy+cp*cz;if(zz<=.12)return null;var f=Math.min(W,H)*.92;return{x:W/2+cx*f/zz,y:H/2-yy*f/zz,z:zz,s:f/zz}}
function cloud(cx,cy,cz,rx,ry,rz,n,seed){var a=[];var s=seed;function rnd(){s=(s*1664525+1013904223)>>>0;return s/4294967296}for(var i=0;i<n;i++){var th=rnd()*Math.PI*2,u=rnd()*2-1,r=Math.sqrt(1-u*u),v=Math.pow(rnd(),.52);a.push({x:cx+Math.cos(th)*r*rx*v,y:cy+u*ry*v,z:cz+Math.sin(th)*r*rz*v,r:(.13+.2*rnd())*v+.08,a:.18+.28*(1-v)})}return a}
var clouds=[];clouds=clouds.concat(cloud(0,3.1,0,3.0,.85,1.55,650,1));clouds=clouds.concat(cloud(-1.8,2.55,.15,1.8,.65,1.25,360,2));clouds=clouds.concat(cloud(1.65,2.5,.25,1.7,.7,1.3,320,3));clouds=clouds.concat(cloud(-.3,4.0,.05,4.0,.7,1.6,600,4));clouds=clouds.concat(cloud(-2.8,3.6,.2,1.5,.5,1,230,5));
var funnel=[];for(var i=0;i<520;i++){var u=Math.random(),ang=Math.random()*Math.PI*2,rad=.08+.65*u*u;funnel.push({u:u,a:ang,r:rad,y:.18+2.0*u})}var dust=[];for(i=0;i<170;i++){var aa=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*1.05;dust.push({x:Math.cos(aa)*rr,z:Math.sin(aa)*rr,y:.06+Math.random()*.22})}
function puff(px,py,rad,alpha,light){var q=x.createRadialGradient(px-rad*.2,py-rad*.25,0,px,py,rad);q.addColorStop(0,light?'rgba(205,216,218,'+alpha+')':'rgba(75,87,91,'+alpha+')');q.addColorStop(.48,light?'rgba(72,83,87,'+alpha*.65+')':'rgba(25,34,39,'+alpha*.75+')');q.addColorStop(1,'rgba(5,10,14,0)');x.fillStyle=q;x.beginPath();x.arc(px,py,rad,0,Math.PI*2);x.fill()}
function drawClouds(){var arr=clouds.slice();arr.sort(function(a,b){return b.z-a.z});for(var i=0;i<arr.length;i++){var o=arr[i],p=proj(o.x,o.y,o.z);if(!p)continue;var size=Math.max(3,p.s*o.r*4.5);puff(p.x,p.y,size,o.a,o.y>3.6)}}
function drawFunnel(){var arr=[];for(var i=0;i<funnel.length;i++){var o=funnel[i],ang=o.a+now*(1.2+o.u*.8),r=o.r*(.8+.2*Math.sin(now*2+o.u*8));arr.push({x:Math.cos(ang)*r,y:o.y,z:Math.sin(ang)*r,s:3.5+7*(1-o.u),a:.08+.25*(1-o.u)})}arr.sort(function(a,b){var A=proj(a.x,a.y,a.z),B=proj(b.x,b.y,b.z);return (B?B.z:0)-(A?A.z:0)});for(i=0;i<arr.length;i++){var p=proj(arr[i].x,arr[i].y,arr[i].z);if(!p)continue;puff(p.x,p.y,Math.max(2,p.s*arr[i].s*.08),arr[i].a,false)}}
function drawDust(){for(var i=0;i<dust.length;i++){var o=dust[i],ang=now*.45+i*.2,rx=o.x*Math.cos(ang)-o.z*Math.sin(ang),rz=o.x*Math.sin(ang)+o.z*Math.cos(ang),p=proj(rx,.04+o.y,rz);if(p)puff(p.x,p.y,Math.max(2,p.s*3),.13,false)}}
function drawRain(){for(var i=0;i<90;i++){var a=(i/90)*Math.PI*2+now*.03,rr=.45+((i*17)%100)/100*1.6,yy=.2+((i*29+now*2)%300)/100;var p=proj(Math.cos(a)*rr,yy,Math.sin(a)*rr+.2);if(!p)continue;x.strokeStyle='rgba(170,190,198,.10)';x.lineWidth=1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-1,p.y+8+p.s*.03);x.stroke()}}
function lightning(){if(Math.random()>.004)return;var p=proj((Math.random()-.5)*1.5,4.1,.1);if(!p)return;x.save();x.strokeStyle='rgba(235,247,255,.95)';x.shadowBlur=24;x.shadowColor='#d8f2ff';x.lineWidth=2.5;x.beginPath();x.moveTo(p.x,p.y);for(var i=0;i<6;i++){x.lineTo(p.x+(Math.random()-.5)*35,p.y+i*25)}x.stroke();x.restore()}
function render(tms){var dt=Math.min(.04,(tms-last)/1000);last=tms;now+=dt;move(dt);x.clearRect(0,0,W,H);var sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#020a12');sky.addColorStop(.5,'#122630');sky.addColorStop(.78,'#637076');sky.addColorStop(1,'#2b3b2c');x.fillStyle=sky;x.fillRect(0,0,W,H);var sun=proj(-4,5,-5);if(sun)puff(sun.x,sun.y,90,.12,true);drawClouds();drawRain();drawFunnel();drawDust();x.fillStyle='#263a29';x.fillRect(0,H*.73,W,H*.27);lightning();requestAnimationFrame(render)}requestAnimationFrame(render);
var rc=document.getElementById('radarCanvas'),r=rc.getContext('2d'),product='ref';function radar(){var im=r.createImageData(360,360),cx=180,cy=180;for(var y=0;y<360;y++)for(var xx=0;xx<360;xx++){var dx=(xx-cx)/180,dy=(y-cy)/180,v=0,ps=[[-.25,-.35,.22,1],[.28,-.05,.14,.7],[.52,.35,.1,.55]];for(var k=0;k<ps.length;k++){var pp=ps[k],qq=Math.hypot(dx-pp[0],dy-pp[1]);v=Math.max(v,Math.exp(-qq*qq/(pp[2]*1.2))*85*pp[3])}var rr=0,gg=0,bb=0;if(product==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{var vel=((xx-cx)*.9-(y-cy)*.55+Math.sin(now*4)*18)*v/50,A=Math.min(1,Math.abs(vel)/60);if(vel<0){bb=230*A;gg=130*A}else{rr=235*A;gg=80*A;bb=45*A}}var n=(y*360+xx)*4;im.data[n]=rr;im.data[n+1]=gg;im.data[n+2]=bb;im.data[n+3]=255}r.putImageData(im,0,0);r.strokeStyle='rgba(255,255,255,.3)';for(var q=45;q<=135;q+=45){r.beginPath();r.arc(180,180,q,0,Math.PI*2);r.stroke()}r.beginPath();r.moveTo(180,0);r.lineTo(180,360);r.moveTo(0,180);r.lineTo(360,180);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(180,180,4,0,Math.PI*2);r.fill()}function setProduct(p){product=p;refBtn.classList.toggle('active',p==='ref');velBtn.classList.toggle('active',p==='vel');productText.textContent=p==='ref'?'Radar simulé · réflectivité Z · dBZ · 0.5°':'Radar simulé · vélocité radiale VEL · kt · 0.5°';minL.textContent=p==='ref'?'5 dBZ':'-60 kt';midL.textContent=p==='ref'?'45 dBZ':'0 kt';maxL.textContent=p==='ref'?'70+ dBZ':'+60 kt'}refBtn.onclick=function(){setProduct('ref')};velBtn.onclick=function(){setProduct('vel')};zBtn.onclick=function(){setProduct('ref')};vBtn.onclick=function(){setProduct('vel')};setInterval(radar,140);radar();var modal=document.getElementById('modal');function stormInfo(){modal.classList.add('show');mt.textContent='🌪️ Supercellule 3D';mb.innerHTML='<p>Nuages volumétriques simulés · enclume · updraft · wall cloud.</p><p>Tornade en rotation et précipitations intégrées à la scène.</p>'}function admin(){modal.classList.add('show');mt.textContent='🛠️ Administration';mb.innerHTML='<p>Rendu 3D logiciel Canvas : aucun WebGL, aucun CDN.</p><p>WASD/ZQSD · souris · Shift · Espace · Ctrl.</p><button id="resetBtn">Réinitialiser</button>';document.getElementById('resetBtn').onclick=function(){P.x=0;P.y=1.7;P.z=9;P.yaw=0;P.pitch=-.08;modal.classList.remove('show')}}document.getElementById('stormBtn').onclick=stormInfo;document.getElementById('adminBtn').onclick=admin;document.getElementById('closeBtn').onclick=function(){modal.classList.remove('show')};})();</script></body></html>
