<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser — 3D Radar</title><style>body{margin:0;overflow:hidden;background:#07111a;color:#eaf4ff;font:14px system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:#07111de6;border:1px solid #486477;border-radius:10px;padding:10px;backdrop-filter:blur(5px);pointer-events:auto}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:90px;width:390px}.radarCanvas{width:360px;height:360px;background:#02080c;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right}.risk{font-weight:700}.green{color:#66e09a}</style></head><body><canvas id="world"></canvas><div class="hud"><div class="top"><div class="panel"><b>🌪️ STORM CHASER</b><br><span id="status">Supercellule détectée — rotation probable</span></div><div class="panel">🛰️ SPC RISK — <span class="risk">ENHANCED</span><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" class="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">Faible</span><span id="midL">Modéré</span><span id="maxL">Fort</span></div><small id="productText">NEXRAD simulé · produit Z · dBZ · balayage 0.5°</small></div><div class="bottom"><button onclick="setProduct('ref')">📡<br><small>Z</small></button><button onclick="setProduct('vel')">💨<br><small>VEL</small></button><button onclick="openStorms()">🌪️<br><small>Storms</small></button><button onclick="openAdmin()">🛠️<br><small>Z</small></button></div></div><div id="modal" class="modal"><div class="window"><button class="close" onclick="modal.classList.remove('show')">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const world=document.getElementById('world'),wctx=world.getContext('2d');const rc=document.getElementById('radarCanvas'),rctx=rc.getContext('2d');let product='ref',phase=0;let cells=[{x:.66,y:.43,r:.18,rot:.7},{x:.38,y:.63,r:.11,rot:-.45},{x:.78,y:.72,r:.07,rot:.25}];
function resize(){world.width=innerWidth;world.height=innerHeight}addEventListener('resize',resize);resize();
function noise(x,y){return Math.sin(x*12.7+y*8.3+Math.sin(x*4+y*3)*2)*.5+.5}
function radar(){let W=360,H=360,cx=180,cy=180;let im=rctx.createImageData(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let dx=(x-cx)/180,dy=(y-cy)/180,d=Math.hypot(dx,dy),v=0;for(const c of cells){let q=Math.hypot(dx-c.x*2+1,dy-c.y*2+1);v=Math.max(v,Math.exp(-q*q/(c.r*1.4))*85)}v+=noise(x/30,y/30)*8*(d<.95?1:0);if(d>.98)v=0;let rr=0,gg=0,bb=0;if(product==='ref'){if(v<15){bb=v*7;gg=v*2}else if(v<35){gg=70+(v-15)*4;bb=100-(v-15)*3}else if(v<55){gg=210;rr=(v-35)*5}else if(v<70){rr=230;gg=120-(v-55)*5}else{rr=255;gg=50;bb=30}}else{let signed=Math.sin((x-cx)*.045+(y-cy)*.035+phase)*v;let a=Math.min(1,Math.abs(signed)/55);if(signed<0){bb=220*a;gg=120*a}else{rr=230*a;gg=80*a;bb=60*a}}let i=(y*W+x)*4;im.data[i]=rr;im.data[i+1]=gg;im.data[i+2]=bb;im.data[i+3]=255}rctx.putImageData(im,0,0);rctx.strokeStyle='#ffffff55';rctx.lineWidth=1;for(let r=45;r<=135;r+=45){rctx.beginPath();rctx.arc(cx,cy,r,0,7);rctx.stroke()}rctx.beginPath();rctx.moveTo(cx,0);rctx.lineTo(cx,H);rctx.moveTo(0,cy);rctx.lineTo(W,cy);rctx.stroke();rctx.fillStyle='#fff';rctx.beginPath();rctx.arc(cx,cy,4,0,7);rctx.fill()}
function setProduct(p){product=p;document.getElementById('refBtn').classList.toggle('active',p==='ref');document.getElementById('velBtn').classList.toggle('active',p==='vel');document.getElementById('productText').textContent=p==='ref'?'NEXRAD simulé · réflectivité Z · dBZ · balayage 0.5°':'NEXRAD simulé · vélocité radiale VEL · kt · balayage 0.5°';document.getElementById('minL').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('midL').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('maxL').textContent=p==='ref'?'70+ dBZ':'+60 kt'}refBtn.onclick=()=>setProduct('ref');velBtn.onclick=()=>setProduct('vel');
function worldDraw(){let W=world.width,H=world.height;wctx.fillStyle='#07131d';wctx.fillRect(0,0,W,H);let sky=wctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#122b40');sky.addColorStop(.58,'#63869a');sky.addColorStop(1,'#263c2b');wctx.fillStyle=sky;wctx.fillRect(0,0,W,H);for(let i=0;i<16;i++){let x=(i*173+phase*8)% (W+300)-150,y=100+(i%5)*55;wctx.fillStyle='#dbe7eb55';wctx.beginPath();wctx.ellipse(x,y,130,35,0,0,7);wctx.ellipse(x+90,y+8,100,28,0,0,7);wctx.fill()}wctx.fillStyle='#234b30';wctx.fillRect(0,H*.72,W,H*.28);for(let i=0;i<80;i++){let x=(i*97)%W,y=H*.68+(i%8)*18;wctx.fillStyle='#173923';wctx.fillRect(x,y,2,30)}requestAnimationFrame(worldDraw)}worldDraw();function loop(){phase+=.015;radar();requestAnimationFrame(loop)}loop();
function openStorms(){modal.classList.add('show');mt.textContent='🌪️ Analyse des cellules';mb.innerHTML='<p><b>Supercellule</b> — structure en crochet probable</p><p>Réflectivité maximale : <b>67 dBZ</b></p><p>Signature de rotation : <b class="green">présente</b></p><p>Vélocité radiale : couple entrant/sortant simulé</p>'}function openAdmin(){modal.classList.add('show');mt.textContent='🛠️ Administration';mb.innerHTML='<p>Contrôle de simulation météo.</p><button onclick="cells.push({x:.5,y:.5,r:.16,rot:1});modal.classList.remove(\'show\')">Créer une cellule</button>'}
</script></body></html>
