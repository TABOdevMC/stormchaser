<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Chaser</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111c;color:#eaf4ff;font:15px system-ui,Arial,sans-serif;overflow:hidden}#game{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#17334b,#07101a 75%)}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;gap:10px}.panel{background:#07111ddd;border:1px solid #456176;border-radius:10px;box-shadow:0 8px 30px #0008;padding:10px 13px;backdrop-filter:blur(5px)}.title{font-weight:800;font-size:18px}.risk{min-width:250px}.risk b{font-size:18px}.meter{height:8px;background:#20303d;border-radius:8px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;width:62%;background:#e7a93b}.bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.slot{width:76px;height:64px;border:1px solid #536c7e;background:#0b1722ee;border-radius:9px;text-align:center;padding:7px;cursor:pointer}.slot:hover,.slot.active{border-color:#8dd8ff;background:#12283a}.key{font-size:11px;color:#8fa9b9}.icon{font-size:24px}.modal{position:fixed;inset:0;display:none;place-items:center;background:#0009;pointer-events:auto}.modal.show{display:grid}.window{width:min(850px,92vw);max-height:82vh;overflow:auto;background:#0b1722;border:1px solid #58748a;border-radius:14px;padding:18px;box-shadow:0 20px 70px #000}.window h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:#101f2c;border:1px solid #2e485b;border-radius:9px;padding:12px}.danger{color:#ff7676}.good{color:#72e1a2}.close{float:right;background:#263c4b;color:white;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}.admin button,.admin select{width:100%;margin:5px 0;padding:9px;border-radius:6px;border:1px solid #456176;background:#142635;color:white}.toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#0b1722ee;border:1px solid #57748a;padding:10px 15px;border-radius:8px;display:none}.toast.show{display:block}
</style></head>
<body><div id="game"><canvas id="radar"></canvas></div>
<div class="hud"><div class="top"><div class="panel"><div class="title">🌪️ STORM CHASER</div><div id="status">Recherche de cellules...</div></div><div class="panel risk"><div>🛰️ SPC RISK — <b id="riskName">ENHANCED</b></div><div class="meter"><i id="riskBar"></i></div><small id="riskInfo">Tornade: 10% · Grêle: 30% · Vent: 30%</small></div></div>
<div class="bottom"><div class="slot active" data-open="radar"><div class="key">1</div><div class="icon">📡</div>Radar</div><div class="slot" data-open="map"><div class="key">2</div><div class="icon">🗺️</div>Carte</div><div class="slot" data-open="storms"><div class="key">3</div><div class="icon">🌪️</div>Tempêtes</div><div class="slot" data-open="gear"><div class="key">4</div><div class="icon">🚙</div>Équipement</div><div class="slot" id="adminSlot"><div class="key">Z</div><div class="icon">🛠️</div>Admin</div></div></div>
<div class="modal" id="modal"><div class="window"><button class="close" onclick="closeModal()">Fermer</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const c=document.getElementById('radar'),ctx=c.getContext('2d');let storms=[];let player={x:.5,y:.55};let risk=['MARGINAL','SLIGHT','ENHANCED','MODERATE','HIGH'],ri=2;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function makeStorm(){let types=['Orage','Supercellule','Tornade EF1','Tornade EF3','Tornade EF5','Grêle'];return {x:.15+Math.random()*.7,y:.2+Math.random()*.6,type:types[Math.floor(Math.random()*types.length)],strength:30+Math.random()*70,dx:(Math.random()-.5)*.0003,dy:(Math.random()-.5)*.0003}}for(let i=0;i<7;i++)storms.push(makeStorm());
function draw(){let w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#294657';ctx.lineWidth=1;for(let x=0;x<w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(const s of storms){s.x+=s.dx;s.y+=s.dy;if(s.x<.05||s.x>.95)s.dx*=-1;if(s.y<.08||s.y>.9)s.dy*=-1;let x=s.x*w,y=s.y*h,r=25+s.strength*.35;let g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,'#e8f8ff99');g.addColorStop(.35,'#65a7d877');g.addColorStop(1,'#214f6300');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=s.type.includes('Tornade')?'#ff8b8b':'#6fc9ff';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.stroke()}let px=player.x*w,py=player.y*h;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,6,0,7);ctx.fill();ctx.strokeStyle='#fff8';ctx.beginPath();ctx.arc(px,py,16,0,7);ctx.stroke();requestAnimationFrame(draw)}draw();
function openModal(kind){let title='',body='';if(kind==='radar'){title='📡 Radar météo';body='<div class="grid"><div class="card">🟢 Faible activité<br>Précipitations faibles</div><div class="card">🟡 Activité modérée<br>Cellules à surveiller</div><div class="card">🔴 Convection forte<br>Risque de tornade</div></div>'}else if(kind==='map'){title='🗺️ Carte & SPC Risk';body='<div class="card"><b>Zone actuelle : ENHANCED</b><p>Risque SPC simulé pour le gameplay. Tornade 10% · Grêle 30% · Vent 30%.</p></div>'}else if(kind==='storms'){title='🌪️ Tempêtes détectées';body='<div class="grid">'+storms.map((s,i)=>`<div class="card"><b>${s.type}</b><br>Intensité: ${Math.round(s.strength)}%<br>Distance: ${Math.round(Math.hypot(s.x-player.x,s.y-player.y)*100)} km</div>`).join('')+'</div>'}else if(kind==='gear'){title='🚙 Équipement';body='<div class="grid"><div class="card">📻 Radio<br>Communication active</div><div class="card">📷 Caméra<br>Observation</div><div class="card">🛰️ GPS<br>Localisation active</div></div>'}else if(kind==='admin'){title='🛠️ Menu Admin';body='<div class="admin"><div class="card">Accès administrateur activé.</div><label>Type de tempête<select id="stype"><option>Orage</option><option>Supercellule</option><option>Tornade EF1</option><option>Tornade EF3</option><option>Tornade EF5</option><option>Grêle</option></select></label><button onclick="spawn()">🌪️ Créer une tempête</button><button onclick="cycleRisk()">🛰️ Changer le risque SPC</button><button onclick="clearStorms()">🧹 Supprimer les tempêtes</button></div>'}document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}function spawn(){let s=makeStorm();s.type=document.getElementById('stype').value;storms.push(s);toast('Tempête créée');openModal('admin')}function clearStorms(){storms=[];toast('Tempêtes supprimées');closeModal()}function cycleRisk(){ri=(ri+1)%risk.length;updateRisk();openModal('admin')}function updateRisk(){document.getElementById('riskName').textContent=risk[ri];document.getElementById('riskBar').style.width=(20+ri*20)+'%';let v=[2,5,10,15,30][ri];document.getElementById('riskInfo').textContent=`Tornade: ${v}% · Grêle: ${Math.min(60,v*3)}% · Vent: ${Math.min(60,v*3)}%`}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
document.querySelectorAll('.slot[data-open]').forEach(e=>e.onclick=()=>openModal(e.dataset.open));document.getElementById('adminSlot').onclick=()=>openModal('admin');addEventListener('keydown',e=>{if(e.key.toLowerCase()==='z')openModal('admin');if(e.key==='Escape')closeModal();if(['1','2','3','4'].includes(e.key))openModal(['radar','map','storms','gear'][+e.key-1])});updateRisk();setInterval(()=>{ri=Math.max(0,Math.min(4,ri+(Math.random()>.85?(Math.random()>.5?1:-1):0)));updateRisk()},8000);
</script></body></html>
