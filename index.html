<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser</title><link rel="icon" href="data:,"/><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019;color:#eef8ff;font:14px system-ui,Arial}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(5,13,21,.86);border:1px solid #526a7b;border-radius:10px;padding:10px;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px #0006}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;background:#02080c;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right;background:#263c4b;color:#fff;border:0;border-radius:6px;padding:6px 10px}</style></head><body><div id="scene"><canvas id="world"></canvas></div><div class="hud"><div class="top"><div class="panel"><b>🌩️ STORM CHASER</b><br><span>Supercellule HP — mésocyclone actif</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" class="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div><small id="productText">Radar simulé · Z · balayage 0.5°</small></div><div class="bottom"><button id="zBtn">📡<br><small>Z</small></button><button id="vBtn">💨<br><small>VEL</small></button><button id="stormBtn">🌪️<br><small>Storm</small></button><button id="adminBtn">🛠️<br><small>Admin</small></button></div></div><div id="modal" class="modal"><div class="window"><button class="close" id="closeBtn">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
(function(){'use strict';
var c=document.getElementById('world'),g=c.getContext('2d'),rc=document.getElementById('radarCanvas'),r=rc.getContext('2d'),t=0,product='ref',flash=0;
function resize(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',resize);resize();
var clouds=[];for(var i=0;i<70;i++)clouds.push({x:Math.random()*1.5-.25,y:.06+Math.random()*.55,s:.5+Math.random()*1.6,z:.2+Math.random()*.8});
function puff(x,y,rx,ry,a,light){g.save();g.globalAlpha=a;var q=g.createRadialGradient(x,y,0,x,y,rx);q.addColorStop(0,light?'rgba(105,119,128,.95)':'rgba(36,49,57,.95)');q.addColorStop(.55,'rgba(15,25,32,.9)');q.addColorStop(1,'rgba(3,10,16,0)');g.fillStyle=q;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();g.restore()}
function storm(sx,sy,scale){g.save();g.translate(sx,sy);g.scale(scale,scale);var grd=g.createRadialGradient(0,-55,5,0,-55,300);grd.addColorStop(0,'rgba(2,7,10,.98)');grd.addColorStop(.55,'rgba(10,19,25,.9)');grd.addColorStop(1,'rgba(10,20,27,0)');g.fillStyle=grd;g.beginPath();g.ellipse(0,-55,300,165,0,0,Math.PI*2);g.fill();for(var i=0;i<18;i++){var a=i*.52+t*.05,rx=95+i*5,yy=-110+i*6;g.strokeStyle=i%3===0?'rgba(115,130,138,.4)':'rgba(49,64,72,.62)';g.lineWidth=10-i*.25;g.beginPath();g.ellipse(Math.cos(a)*15,yy,rx,32,(a*.35),.1*Math.PI,1.38*Math.PI);g.stroke()}puff(-85,-90,145,55,.65,true);puff(65,-105,175,60,.62,true);puff(-185,-60,115,45,.5,false);puff(170,-65,125,45,.48,false);puff(15,5,130,52,.78,false);puff(-75,5,90,38,.62,false);g.globalAlpha=.42;g.fillStyle='#2c3c43';g.beginPath();g.ellipse(70,20,120,150,.1,0,Math.PI*2);g.fill();/* rotating wall cloud */for(i=0;i<8;i++){g.globalAlpha=.35;g.strokeStyle='#87969c';g.lineWidth=3;g.beginPath();g.arc(-25,15,45+i*12,t*1.5+i*.4,t*1.5+Math.PI*1.1);g.stroke()}/* funnel */g.globalAlpha=.9;g.fillStyle='#182328';g.beginPath();g.moveTo(-42,20);g.bezierCurveTo(-62,62,-43,92,-22,125);g.bezierCurveTo(-8,148,12,151,28,125);g.bezierCurveTo(45,92,54,55,32,20);g.closePath();g.fill();g.globalAlpha=.25;g.fillStyle='#c5cecf';g.beginPath();g.ellipse(2,130,75,20,0,0,Math.PI*2);g.fill();/* rain */g.globalAlpha=.2;g.strokeStyle='#a9bec6';for(i=0;i<100;i++){var x=-160+i*3;g.beginPath();g.moveTo(x,35);g.lineTo(x-22,220);g.stroke()}g.restore()}
function bolt(x,y){g.save();g.strokeStyle='#effaff';g.shadowBlur=28;g.shadowColor='#bfeaff';g.lineWidth=3;g.beginPath();g.moveTo(x,y);for(var i=1;i<7;i++)g.lineTo(x+(Math.random()-.5)*45,y+i*25);g.stroke();g.restore()}
function draw(){var W=c.width,H=c.height,sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#020711');sky.addColorStop(.4,'#102430');sky.addColorStop(.72,'#59676d');sky.addColorStop(1,'#243526');g.fillStyle=sky;g.fillRect(0,0,W,H);var sx=W*.7,sy=H*.35;for(var i=0;i<clouds.length;i++){var cl=clouds[i],x=((cl.x+t*.004*cl.z)%1.5-.25)*W;puff(x,cl.y*H,55*cl.s*(.5+cl.z),22*cl.s,.06+.1*cl.z,false)}storm(sx,sy,Math.max(.7,Math.min(1.15,W/1100)));if(Math.random()<.012)flash=5;if(flash){flash--;g.fillStyle='rgba(225,244,255,.15)';g.fillRect(0,0,W,H);bolt(sx+Math.sin(t*4)*100,sy+10)}g.fillStyle='#29482e';g.fillRect(0,H*.73,W,H*.27);for(i=0;i<110;i++){var tx=(i*137)%W,ty=H*.72+(i%10)*16;g.strokeStyle='#193522';g.beginPath();g.moveTo(tx,ty);g.lineTo(tx+(i%3-1)*5,ty-28-(i%6)*4);g.stroke()}t+=.016;requestAnimationFrame(draw)}draw();
function radar(){var W=360,H=360,cx=180,cy=180,im=r.createImageData(W,H),ps=[{x:.38,y:.31,s:.24,a:1},{x:.06,y:.43,s:.13,a:.75},{x:.56,y:.55,s:.1,a:.6}];for(var y=0;y<H;y++)for(var x=0;x<W;x++){var dx=(x-cx)/180,dy=(y-cy)/180,v=0;for(var k=0;k<ps.length;k++){var p=ps[k],q=Math.hypot(dx-(p.x*2-1),dy-(p.y*2-1));v=Math.max(v,Math.exp(-q*q/(p.s*1.25))*85*p.a)}var rr=0,gg=0,bb=0;if(product==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{var signed=((x-cx)*.9-(y-cy)*.55+Math.sin(t*4)*18)*v/50,a=Math.min(1,Math.abs(signed)/60);if(signed<0){bb=230*a;gg=130*a}else{rr=235*a;gg=80*a;bb=45*a}}var n=(y*W+x)*4;im.data[n]=rr;im.data[n+1]=gg;im.data[n+2]=bb;im.data[n+3]=255}r.putImageData(im,0,0);r.strokeStyle='rgba(255,255,255,.32)';for(var q2=45;q2<=135;q2+=45){r.beginPath();r.arc(cx,cy,q2,0,Math.PI*2);r.stroke()}r.beginPath();r.moveTo(cx,0);r.lineTo(cx,H);r.moveTo(0,cy);r.lineTo(W,cy);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,4,0,Math.PI*2);r.fill()}
function setProduct(p){product=p;document.getElementById('refBtn').classList.toggle('active',p==='ref');document.getElementById('velBtn').classList.toggle('active',p==='vel');document.getElementById('productText').textContent=p==='ref'?'Radar simulé · réflectivité Z · dBZ · balayage 0.5°':'Radar simulé · vélocité radiale VEL · kt · balayage 0.5°';document.getElementById('minL').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('midL').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('maxL').textContent=p==='ref'?'70+ dBZ':'+60 kt'}document.getElementById('refBtn').onclick=function(){setProduct('ref')};document.getElementById('velBtn').onclick=function(){setProduct('vel')};document.getElementById('zBtn').onclick=function(){setProduct('ref')};document.getElementById('vBtn').onclick=function(){setProduct('vel')};
var modal=document.getElementById('modal');function openStorms(){modal.classList.add('show');document.getElementById('mt').textContent='🌪️ Supercellule — analyse';document.getElementById('mb').innerHTML='<p><b>Structure :</b> supercellule HP à mésocyclone persistant</p><p><b>Updraft :</b> puissant · <b>Enclume :</b> large et multicouche</p><p><b>Wall cloud :</b> visible · <b>Rotation :</b> forte</p><p><b>Précipitations :</b> noyau intense + rideau arrière</p>'}function openAdmin(){modal.classList.add('show');document.getElementById('mt').textContent='🛠️ Administration';document.getElementById('mb').innerHTML='<p>Simulation météo — contrôle administrateur.</p><button id="resetBtn">Réinitialiser</button>';document.getElementById('resetBtn').onclick=function(){location.reload()}}document.getElementById('stormBtn').onclick=openStorms;document.getElementById('adminBtn').onclick=openAdmin;document.getElementById('closeBtn').onclick=function(){modal.classList.remove('show')};addEventListener('keydown',function(e){if(e.key.toLowerCase()==='z')openAdmin();if(e.key==='Escape')modal.classList.remove('show')});setInterval(radar,100);radar();
})();</script></body></html>
