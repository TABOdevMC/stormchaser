<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03070b;color:#eef6f8;font:13px Arial,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}.hud{position:fixed;inset:0;pointer-events:none}.glass{background:rgba(4,10,15,.78);border:1px solid rgba(150,180,190,.28);box-shadow:0 10px 35px rgba(0,0,0,.35);backdrop-filter:blur(8px)}.top{display:flex;justify-content:space-between;gap:12px;padding:14px}.brand{padding:10px 14px;border-radius:8px;letter-spacing:.08em}.brand b{font-size:16px}.risk{padding:10px 14px;border-radius:8px;text-align:right}.risk strong{color:#ffd45a}.radar{position:absolute;left:16px;top:84px;width:360px;padding:10px;border-radius:10px}.radarHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.radarHead b{letter-spacing:.08em}.tabs button,.hotbar button{border:1px solid #48606d;background:#101e27;color:#dcebf0;border-radius:6px;cursor:pointer}.tabs button{padding:5px 8px}.tabs .on{background:#2a5565}.rad{width:338px;height:338px;border-radius:50%;display:block;background:#02070a;border:1px solid #68818c}.radarFoot{display:flex;justify-content:space-between;color:#9fb2ba;font-size:10px;margin-top:6px}.hotbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;padding:7px;border-radius:10px}.hotbar button{width:62px;height:54px;font-size:19px}.hotbar small{font-size:10px}.help{position:absolute;right:14px;bottom:14px;padding:9px 11px;border-radius:8px;color:#b9cbd1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(650px,90vw);padding:18px;border-radius:12px}.close{float:right;background:#20343e;color:white;border:0;border-radius:5px;padding:6px 10px}.tag{display:inline-block;padding:4px 7px;border-radius:5px;background:#17333e;margin:2px}
</style></head><body><canvas id="scene"></canvas><div class="hud"><div class="top"><div class="glass brand"><b>STORM CHASER</b><br><span id="state">SUPERCELL · MESOCYCLONE ACTIF</span></div><div class="glass risk">SPC RISK <strong>ENHANCED</strong><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="glass radar"><div class="radarHead"><b>RADAR / NEXRAD</b><div class="tabs"><button id="ref" class="on">REF</button><button id="vel">VEL</button></div></div><canvas id="rad" class="rad" width="676" height="676"></canvas><div class="radarFoot"><span id="l1">5 dBZ</span><span id="l2">45 dBZ</span><span id="l3">70+ dBZ</span><span>0.5° · LIVE</span></div></div><div class="hotbar glass"><button id="map">🗺️<br><small>MAP</small></button><button id="bz">📡<br><small>REF</small></button><button id="bv">💨<br><small>VEL</small></button><button id="storm">⛈️<br><small>STORM</small></button><button id="admin">⚙️<br><small>ADMIN</small></button></div><div class="glass help">WASD / ZQSD · souris · Shift sprint<br>Espace monter · Ctrl descendre · Échap libérer</div></div><div id="modal" class="modal"><div class="glass window"><button class="close" id="close">Fermer</button><h2 id="title"></h2><div id="body"></div></div></div><script>
(function(){'use strict';
var c=document.getElementById('scene'),g=c.getContext('2d'),rad=document.getElementById('rad'),r=rad.getContext('2d');var W=innerWidth,H=innerHeight,D=1,t=0,last=performance.now(),product='ref',flash=0;var P={x:0,y:1.65,z:9,yaw:0,pitch:-.05};var keys={};
function resize(){D=Math.min(2,devicePixelRatio||1);c.width=innerWidth*D;c.height=innerHeight*D;g.setTransform(D,0,0,D,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function project(x,y,z){var dx=x-P.x,dy=y-P.y,dz=z-P.z,co=Math.cos(P.yaw),si=Math.sin(P.yaw),X=dx*co-dz*si,Z=dx*si+dz*co,cp=Math.cos(P.pitch),sp=Math.sin(P.pitch),Y=dy*cp-Z*sp;Z=dy*sp+Z*cp;if(Z<.2)return null;var f=Math.min(W,H)*.92;return{x:W/2+X*f/Z,y:H/2-Y*f/Z,s:f/Z,z:Z}}
function noise(x){var n=Math.sin(x*12.9898)*43758.5453;return n-Math.floor(n)}
var cloud=[];function buildCloud(cx,cy,cz,rx,ry,rz,count,seed){for(var i=0;i<count;i++){var a=noise(seed+i*2.1)*Math.PI*2,u=noise(seed+i*3.7)*2-1,q=Math.pow(noise(seed+i*5.3),.48),rr=Math.sqrt(1-u*u);cloud.push({x:cx+Math.cos(a)*rr*rx*q,y:cy+u*ry*q,z:cz+Math.sin(a)*rr*rz*q,s:.10+.24*noise(seed+i*7.1),a:.18+.30*(1-q)})}}
buildCloud(0,3.2,.2,3.0,1.15,1.9,430,1);buildCloud(-2,3.0,.3,1.9,.75,1.25,220,2);buildCloud(2,2.85,.4,1.9,.85,1.4,220,3);buildCloud(-.4,4.05,.1,4.5,.75,2.1,420,4);buildCloud(-3.2,3.65,.1,1.7,.55,1.1,140,5);
function cloudDraw(p,size,light,a){var rr=p.s*size;if(rr<1)rr=1;var q=g.createRadialGradient(p.x-rr*.3,p.y-rr*.32,0,p.x,p.y,rr);if(light){q.addColorStop(0,'rgba(180,193,198,'+a+')');q.addColorStop(.32,'rgba(90,103,109,'+(a*.8)+')');q.addColorStop(.72,'rgba(31,39,44,'+(a*.55)+')')}else{q.addColorStop(0,'rgba(57,68,74,'+a+')');q.addColorStop(.4,'rgba(25,33,39,'+(a*.8)+')');q.addColorStop(.8,'rgba(8,14,19,'+(a*.45)+')')}q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.beginPath();g.arc(p.x,p.y,rr,0,Math.PI*2);g.fill()}
function sky(){var s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#02060c');s.addColorStop(.34,'#081722');s.addColorStop(.63,'#253841');s.addColorStop(.78,'#6a7778');s.addColorStop(1,'#18251b');g.fillStyle=s;g.fillRect(0,0,W,H);var gl=g.createRadialGradient(W*.54,H*.29,0,W*.54,H*.29,330);gl.addColorStop(0,'rgba(150,180,188,.15)');gl.addColorStop(1,'rgba(50,70,75,0)');g.fillStyle=gl;g.fillRect(0,0,W,H)}
function ground(){g.fillStyle='#26392a';g.fillRect(0,H*.72,W,H*.28);g.fillStyle='rgba(105,116,103,.18)';g.fillRect(0,H*.70,W,H*.03);for(var i=0;i<70;i++){var x=((i*113-P.x*16)%W+W)%W,y=H*.72+(i%9)*17;g.strokeStyle='rgba(13,34,19,.45)';g.beginPath();g.moveTo(x,y);g.lineTo(x+(i%3-1)*5,y-8-(i%5)*4);g.stroke()}}
function storm(){var a=cloud.slice();a.sort(function(x,y){return y.z-x.z});for(var i=0;i<a.length;i++){var o=a[i],p=project(o.x,o.y,o.z);if(p)cloudDraw(p,5.4*(1+o.y*.04),o.y>3.6,o.a)}var wall=project(-.35,1.7,.25);if(wall){var q=g.createRadialGradient(wall.x,wall.y,0,wall.x,wall.y,wall.s*1.3);q.addColorStop(0,'rgba(4,9,12,.65)');q.addColorStop(.55,'rgba(19,27,31,.5)');q.addColorStop(1,'rgba(10,15,18,0)');g.fillStyle=q;g.beginPath();g.ellipse(wall.x,wall.y,wall.s*1.2,wall.s*.38,0,0,Math.PI*2);g.fill()}
for(i=0;i<170;i++){var u=noise(i*4.2),ang=noise(i*2.8)*Math.PI*2+t*(1.1+u*.9),rad2=(.05+.62*u*u),x=-.25+Math.cos(ang)*rad2,z=.25+Math.sin(ang)*rad2,y=.18+u*2.15,p=project(x,y,z);if(p)cloudDraw(p,2.1+3*(1-u),false,.10+.12*(1-u))}var dust=project(-.25,.04,.25);if(dust){g.fillStyle='rgba(156,139,110,.22)';g.beginPath();g.ellipse(dust.x,dust.y,dust.s*.48,dust.s*.11,0,0,Math.PI*2);g.fill()}}
function rain(){g.lineWidth=1;for(var i=0;i<75;i++){var a=noise(i*8)*Math.PI*2,rr=.4+noise(i*4)*1.1,y=.3+((i*37+t*2.5)%260)/100,p=project(1.0+Math.cos(a)*rr,y,.4+Math.sin(a)*rr);if(p){g.strokeStyle='rgba(175,201,208,.11)';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-1,p.y+7+p.s*.02);g.stroke()}}}
function lightning(){if(Math.random()>.004)return;flash=5;var p=project((Math.random()-.5)*1.5,4.1,.2);if(!p)return;g.save();g.strokeStyle='rgba(235,248,255,.95)';g.shadowBlur=30;g.shadowColor='rgba(190,225,255,.9)';g.lineWidth=2.5;g.beginPath();g.moveTo(p.x,p.y);for(var i=0;i<8;i++)g.lineTo(p.x+(Math.random()-.5)*35,p.y+i*22);g.stroke();g.restore()}
function move(dt){var f=(keys.w||keys.z?1:0)-(keys.s?1:0),q=(keys.d?1:0)-(keys.a||keys.q?1:0),n=Math.hypot(f,q)||1,sp=keys.shift?6.5:3.2;f/=n;q/=n;var co=Math.cos(P.yaw),si=Math.sin(P.yaw);P.x+=(si*f+co*q)*sp*dt;P.z+=(-co*f+si*q)*sp*dt;if(keys[' '])P.y+=sp*dt;if(keys.control)P.y-=sp*dt;P.y=Math.max(.45,Math.min(10,P.y))}
function frame(now){var dt=Math.min(.04,(now-last)/1000);last=now;move(dt);t+=dt;sky();ground();storm();rain();lightning();if(flash){g.fillStyle='rgba(225,242,255,.07)';g.fillRect(0,0,W,H);flash--}requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='z'&&!e.target.matches('button,input'))openAdmin()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});c.onclick=function(){if(c.requestPointerLock)c.requestPointerLock()};document.addEventListener('mousemove',function(e){if(document.pointerLockElement===c){P.yaw-=e.movementX*.002;P.pitch-=e.movementY*.0015;P.pitch=Math.max(-1.15,Math.min(1.15,P.pitch))}});
function radar(){var N=676,cx=N/2,cy=N/2,im=r.createImageData(N,N),now=t;for(var y=0;y<N;y++){for(var x=0;x<N;x++){var dx=(x-cx)/N*2,dy=(y-cy)/N*2,rr0=Math.hypot(dx,dy),v=0;var cells=[[-.24,-.32,.24,1],[.18,-.05,.15,.72],[.48,.30,.10,.52],[-.48,.28,.12,.4]];for(var k=0;k<cells.length;k++){var cc=cells[k],d=Math.hypot(dx-cc[0],dy-cc[1]);v=Math.max(v,Math.exp(-d*d/(cc[2]*cc[2]))*85*cc[3])}v*=Math.max(0,1-rr0*.16);var R=0,G=0,B=0;if(rr0>1){R=4;G=8;B=10}else if(product==='ref'){if(v<12){B=35+v*5;G=v*1.4}else if(v<30){G=70+(v-12)*5;B=110-(v-12)*3}else if(v<50){G=210;R=(v-30)*5}else if(v<65){R=245;G=145-(v-50)*6}else{R=255;G=45;B=15}}else{var vel=((dx)*.9-dy*.75+Math.sin(now*2.8)*.05)*v*1.2,A=Math.min(1,Math.abs(vel)/55);if(vel<0){B=225*A;G=120*A}else{R=235*A;G=70*A;B=35*A}}var n=(y*N+x)*4;im.data[n]=R;im.data[n+1]=G;im.data[n+2]=B;im.data[n+3]=255}}r.putImageData(im,0,0);r.save();r.strokeStyle='rgba(210,235,240,.28)';r.lineWidth=2;for(var q=85;q<=255;q+=85){r.beginPath();r.arc(cx,cy,q,0,Math.PI*2);r.stroke()}r.strokeStyle='rgba(210,235,240,.16)';r.beginPath();r.moveTo(cx,0);r.lineTo(cx,N);r.moveTo(0,cy);r.lineTo(N,cy);r.stroke();var sweep=(now*1.4)%(Math.PI*2);r.strokeStyle='rgba(190,245,255,.5)';r.beginPath();r.moveTo(cx,cy);r.lineTo(cx+Math.cos(sweep)*320,cy+Math.sin(sweep)*320);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,6,0,Math.PI*2);r.fill();r.restore()}
function setProduct(p){product=p;document.getElementById('ref').classList.toggle('on',p==='ref');document.getElementById('vel').classList.toggle('on',p==='vel');document.getElementById('l1').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('l2').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('l3').textContent=p==='ref'?'70+ dBZ':'+60 kt'}document.getElementById('ref').onclick=function(){setProduct('ref')};document.getElementById('vel').onclick=function(){setProduct('vel')};document.getElementById('bz').onclick=function(){setProduct('ref')};document.getElementById('bv').onclick=function(){setProduct('vel')};setInterval(radar,100);radar();
var modal=document.getElementById('modal');function show(title,body){modal.classList.add('show');document.getElementById('title').textContent=title;document.getElementById('body').innerHTML=body}function openAdmin(){show('⚙️ Administration','<p><span class="tag">Moteur Canvas 3D logiciel</span><span class="tag">Radar simulé</span><span class="tag">Météo dynamique</span></p><p>Déplacement libre activé. Aucun WebGL ni CDN externe.</p>')}document.getElementById('storm').onclick=function(){show('⛈️ Analyse de la supercellule','<p><b>Structure :</b> supercellule LP/HP avec enclume, updraft et wall cloud.</p><p><b>Rotation :</b> mésocyclone simulé · <b>Noyau :</b> précipitations intenses.</p>')};document.getElementById('map').onclick=function(){show('🗺️ Carte de chasse','<p>Carte radar centrée sur votre position. Utilisez REF pour la réflectivité et VEL pour la vitesse radiale.</p>')};document.getElementById('admin').onclick=openAdmin;document.getElementById('close').onclick=function(){modal.classList.remove('show')};addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('show')});})();
