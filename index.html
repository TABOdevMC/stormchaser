<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Chaser</title><link rel="icon" href="data:,"/><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019;color:#eef8ff;font:14px system-ui,Arial}#world{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(5,13,21,.86);border:1px solid #526a7b;border-radius:10px;padding:10px;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px #0006}.top{display:flex;justify-content:space-between;padding:14px}.radar{position:absolute;left:14px;top:88px;width:390px}.radarCanvas{width:360px;height:360px;background:#02080c;border-radius:50%;border:1px solid #527080}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button,.bottom button{background:#142736;color:#dff3ff;border:1px solid #456176;border-radius:6px;padding:7px;cursor:pointer}.tabs button.active{background:#24506a}.legend{display:flex;justify-content:space-between;font-size:11px;color:#9db4c2;margin-top:6px}.bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.bottom button{font-size:20px;width:65px;height:58px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;pointer-events:auto}.modal.show{display:grid}.window{width:min(700px,90vw);background:#0b1722;border:1px solid #58748a;border-radius:12px;padding:18px}.close{float:right;background:#263c4b;color:#fff;border:0;border-radius:6px;padding:6px 10px}</style></head><body><canvas id="world"></canvas><div class="hud"><div class="top"><div class="panel"><b>🌩️ STORM CHASER</b><br><span>Supercellule HP — mésocyclone actif</span></div><div class="panel">🛰️ SPC RISK — <b>ENHANCED</b><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div></div><div class="radar panel"><div class="tabs"><button id="refBtn" class="active">Réflectivité</button><button id="velBtn">Vélocité</button></div><canvas id="radarCanvas" class="radarCanvas" width="360" height="360"></canvas><div class="legend"><span id="minL">5 dBZ</span><span id="midL">45 dBZ</span><span id="maxL">70+ dBZ</span></div><small id="productText">Radar simulé · Z · balayage 0.5°</small></div><div class="bottom"><button id="zBtn">📡<br><small>Z</small></button><button id="vBtn">💨<br><small>VEL</small></button><button id="stormBtn">🌪️<br><small>Storm</small></button><button id="adminBtn">🛠️<br><small>Admin</small></button></div></div><div id="modal" class="modal"><div class="window"><button class="close" id="closeBtn">Fermer</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
(function(){'use strict';
var c=document.getElementById('world'),g=c.getContext('2d'),rc=document.getElementById('radarCanvas'),r=rc.getContext('2d');var W=0,H=0,t=0,product='ref',flash=0;var particles=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;particles=[];for(var i=0;i<900;i++)particles.push({a:Math.random()*Math.PI*2,d:Math.random(),y:Math.random(),s:.3+Math.random()*1.2})}addEventListener('resize',resize);resize();
function hash(n){var x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}
function cloudBlob(x,y,s,alpha,light){g.save();g.globalAlpha=alpha;var q=g.createRadialGradient(x-s*.1,y-s*.15,0,x,y,s);q.addColorStop(0,light?'rgba(155,168,174,.92)':'rgba(50,61,67,.96)');q.addColorStop(.38,'rgba(35,46,53,.9)');q.addColorStop(.75,'rgba(13,23,30,.68)');q.addColorStop(1,'rgba(3,10,16,0)');g.fillStyle=q;g.beginPath();g.ellipse(x,y,s,s*.42,0,0,Math.PI*2);g.fill();g.restore()}
function cloudField(sx,sy){for(var i=0;i<42;i++){var u=i/41;var x=sx+(u-.5)*720;var dome=Math.sin(u*Math.PI);var y=sy-150-dome*105+hash(i)*38;var s=55+hash(i+90)*75;cloudBlob(x,y,s,.34+(1-dome)*.08,i%7===0)}/* soft distant shelf */for(i=0;i<14;i++){x=sx-700+i*110;y=sy-105+hash(i+300)*55;cloudBlob(x,y,90+hash(i+400)*45,.16,false)}}
function anvil(sx,sy){g.save();var grad=g.createRadialGradient(sx,sy-230,20,sx,sy-230,420);grad.addColorStop(0,'rgba(116,129,137,.32)');grad.addColorStop(.55,'rgba(38,51,58,.48)');grad.addColorStop(1,'rgba(6,14,20,0)');g.fillStyle=grad;g.beginPath();g.ellipse(sx,sy-225,430,145,0,0,Math.PI*2);g.fill();g.restore()}
function rain(sx,sy){g.save();g.globalAlpha=.17;g.strokeStyle='#b8c8cc';g.lineWidth=1;for(var i=0;i<230;i++){var x=sx-230+(i%115)*4;var y=sy+20+(i%23)*5;g.beginPath();g.moveTo(x,y);g.lineTo(x-35,y+260+hash(i)*130);g.stroke()}g.restore()}
function dust(sx,ground){g.save();g.globalAlpha=.18;for(var i=0;i<70;i++){var a=hash(i+800)*Math.PI*2,rr=15+hash(i+900)*90;g.fillStyle='#9b8f7a';g.beginPath();g.arc(sx+Math.cos(a)*rr,ground+Math.sin(a)*10,2+hash(i+1000)*5,0,Math.PI*2);g.fill()}g.restore()}
function tornado(sx,top,ground){g.save();var h=ground-top;for(var i=0;i<90;i++){var u=i/89;var y=top+u*h;var radius=9+Math.pow(u,.72)*58*(.72+.28*Math.sin(u*Math.PI));var x=sx+Math.sin(t*3.1+u*13)*radius*.18;var wob=Math.sin(t*2+u*9)*6;g.globalAlpha=.10+.13*(1-u);g.fillStyle=i%3===0?'#d0d6d6':'#303b40';g.beginPath();g.ellipse(x+wob,y,radius*(.08+.13*u),8+u*8,0,0,Math.PI*2);g.fill()}g.globalAlpha=.35;g.fillStyle='#b8c0bf';g.beginPath();g.ellipse(sx,ground,75,17,0,0,Math.PI*2);g.fill();g.restore()}
function supercell(sx,sy){/* smooth silhouette: no rings or wireframe */cloudField(sx,sy);anvil(sx,sy);var up=g.createRadialGradient(sx,sy-30,10,sx,sy-30,240);up.addColorStop(0,'rgba(4,10,14,.95)');up.addColorStop(.5,'rgba(11,19,25,.72)');up.addColorStop(1,'rgba(10,20,27,0)');g.fillStyle=up;g.beginPath();g.ellipse(sx,sy-30,235,175,0,0,Math.PI*2);g.fill();cloudBlob(sx-95,sy-25,125,.55,false);cloudBlob(sx+15,sy-70,145,.62,false);cloudBlob(sx+115,sy-35,120,.5,false);cloudBlob(sx-10,sy+10,145,.68,false);/* wall cloud */cloudBlob(sx-15,sy+48,110,.72,false);cloudBlob(sx-75,sy+42,75,.52,false);/* rain wrapped rear flank */rain(sx+105,sy+20);tornado(sx-18,sy+62,H*.73);dust(sx-18,H*.73)}
function lightning(x,y){g.save();g.strokeStyle='#eaf8ff';g.shadowBlur=24;g.shadowColor='#bde9ff';g.lineWidth=2.5;g.beginPath();g.moveTo(x,y);for(var i=1;i<7;i++)g.lineTo(x+(hash(t*100+i)-.5)*70,y+i*30);g.stroke();g.restore()}
function ground(){var gy=H*.73;g.fillStyle='#263d29';g.fillRect(0,gy,W,H-gy);var fog=g.createLinearGradient(0,gy-80,0,gy+80);fog.addColorStop(0,'rgba(165,176,175,0)');fog.addColorStop(1,'rgba(110,123,119,.16)');g.fillStyle=fog;g.fillRect(0,gy-80,W,160);for(var i=0;i<150;i++){var x=(i*97)%W;var y=gy+(i%13)*14;g.strokeStyle='rgba(18,37,24,.65)';g.beginPath();g.moveTo(x,y);g.lineTo(x+(i%3-1)*5,y-20-(i%5)*5);g.stroke()}}
function draw(){var sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#020810');sky.addColorStop(.38,'#0b1d29');sky.addColorStop(.68,'#46565f');sky.addColorStop(1,'#738083');g.fillStyle=sky;g.fillRect(0,0,W,H);var sx=W*.68,sy=H*.40;/* horizon haze */g.fillStyle='rgba(210,220,218,.10)';g.fillRect(0,H*.55,W,H*.18);cloudField(sx,sy);supercell(sx,sy);if(Math.random()<.012)flash=4;if(flash){flash--;g.fillStyle='rgba(225,242,255,.10)';g.fillRect(0,0,W,H);lightning(sx+Math.sin(t*3)*120,sy-15)}ground();t+=.016;requestAnimationFrame(draw)}draw();
function radar(){var W2=360,H2=360,cx=180,cy=180,im=r.createImageData(W2,H2),ps=[{x:.38,y:.31,s:.24,a:1},{x:.06,y:.43,s:.13,a:.75},{x:.56,y:.55,s:.1,a:.6}];for(var y=0;y<H2;y++)for(var x=0;x<W2;x++){var dx=(x-cx)/180,dy=(y-cy)/180,v=0;for(var k=0;k<ps.length;k++){var p=ps[k],q=Math.hypot(dx-(p.x*2-1),dy-(p.y*2-1));v=Math.max(v,Math.exp(-q*q/(p.s*1.25))*85*p.a)}var rr=0,gg=0,bb=0;if(product==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{var signed=((x-cx)*.9-(y-cy)*.55+Math.sin(t*4)*18)*v/50;var a=Math.min(1,Math.abs(signed)/60);if(signed<0){bb=230*a;gg=130*a}else{rr=235*a;gg=80*a;bb=45*a}}var n=(y*W2+x)*4;im.data[n]=rr;im.data[n+1]=gg;im.data[n+2]=bb;im.data[n+3]=255}r.putImageData(im,0,0);r.strokeStyle='rgba(255,255,255,.32)';for(var q2=45;q2<=135;q2+=45){r.beginPath();r.arc(cx,cy,q2,0,Math.PI*2);r.stroke()}r.beginPath();r.moveTo(cx,0);r.lineTo(cx,H2);r.moveTo(0,cy);r.lineTo(W2,cy);r.stroke();r.fillStyle='#fff';r.beginPath();r.arc(cx,cy,4,0,Math.PI*2);r.fill()}
function setProduct(p){product=p;document.getElementById('refBtn').classList.toggle('active',p==='ref');document.getElementById('velBtn').classList.toggle('active',p==='vel');document.getElementById('productText').textContent=p==='ref'?'Radar simulé · réflectivité Z · dBZ · balayage 0.5°':'Radar simulé · vélocité radiale VEL · kt · balayage 0.5°';document.getElementById('minL').textContent=p==='ref'?'5 dBZ':'-60 kt';document.getElementById('midL').textContent=p==='ref'?'45 dBZ':'0 kt';document.getElementById('maxL').textContent=p==='ref'?'70+ dBZ':'+60 kt'}document.getElementById('refBtn').onclick=function(){setProduct('ref')};document.getElementById('velBtn').onclick=function(){setProduct('vel')};document.getElementById('zBtn').onclick=function(){setProduct('ref')};document.getElementById('vBtn').onclick=function(){setProduct('vel')};var modal=document.getElementById('modal');function openStorms(){modal.classList.add('show');document.getElementById('mt').textContent='🌪️ Supercellule — analyse';document.getElementById('mb').innerHTML='<p><b>Structure :</b> supercellule HP à mésocyclone persistant</p><p><b>Updraft :</b> puissant · <b>Enclume :</b> large et multicouche</p><p><b>Wall cloud :</b> visible · <b>Rotation :</b> forte</p><p><b>Précipitations :</b> noyau intense + rideau arrière</p>'}function openAdmin(){modal.classList.add('show');document.getElementById('mt').textContent='🛠️ Administration';document.getElementById('mb').innerHTML='<p>Simulation météo — contrôle administrateur.</p><button id="resetBtn">Réinitialiser</button>';document.getElementById('resetBtn').onclick=function(){location.reload()}}document.getElementById('stormBtn').onclick=openStorms;document.getElementById('adminBtn').onclick=openAdmin;document.getElementById('closeBtn').onclick=function(){modal.classList.remove('show')};addEventListener('keydown',function(e){if(e.key.toLowerCase()==='z')openAdmin();if(e.key==='Escape')modal.classList.remove('show')});setInterval(radar,100);radar();})();</script></body></html>
