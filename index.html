<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Storm Chaser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019;color:#eaf5fb;font-family:system-ui,Arial,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;background:rgba(5,13,22,.88);border:1px solid rgba(130,164,181,.42);border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.35);backdrop-filter:blur(8px)}.top{display:flex;justify-content:space-between;gap:12px;padding:14px}.info{padding:10px 13px;min-width:230px}.info small{color:#9eb5c2}.risk{font-weight:800}.radar{position:absolute;left:14px;top:88px;width:390px;padding:10px}.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button,.hotbar button,.modal button{border:1px solid #456476;background:#122736;color:#e8f6fc;border-radius:7px;padding:8px 10px;cursor:pointer}.tabs button.active{background:#24536b}.radar canvas{display:block;width:360px;height:360px;border-radius:50%;border:1px solid #5b7482;background:#02070b}.legend{display:flex;justify-content:space-between;color:#a8bdc7;font-size:11px;margin-top:5px}.radar small{color:#91aab7}.hotbar{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.hotbar button{width:74px;height:58px;font-size:20px}.hotbar small{font-size:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;pointer-events:auto}.modal.open{display:grid}.window{width:min(680px,92vw);padding:18px;background:#0a1722;border:1px solid #5c7585;border-radius:13px;box-shadow:0 20px 60px #0008}.close{float:right}.window h2{margin-top:0}.window label{display:block;margin:12px 0}.window input,.window select{width:100%;padding:9px;background:#07121b;color:white;border:1px solid #476171;border-radius:6px}.status{color:#a9c3ce}.kbd{padding:2px 6px;border:1px solid #607887;border-radius:4px;background:#162a36}.mobile{display:none}@media(max-width:800px){.radar{transform:scale(.75);transform-origin:top left}.top{padding:8px}.info{min-width:0;font-size:12px}.hotbar button{width:62px}.mobile{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div class="panel info"><b>🌩️ STORM CHASER</b><br><span id="stormState">Supercellule en approche</span><br><small>WASD : déplacer · souris : caméra · Z : admin</small></div>
    <div class="panel info">🛰️ SPC RISK — <span class="risk">ENHANCED</span><br><small>Tornade 10% · Grêle 30% · Vent 30%</small></div>
  </div>
  <section class="panel radar">
    <div class="tabs"><button id="refTab" class="active">Réflectivité</button><button id="velTab">Vélocité</button></div>
    <canvas id="radar" width="360" height="360"></canvas>
    <div class="legend"><span id="lo">5 dBZ</span><span id="mid">45 dBZ</span><span id="hi">70+ dBZ</span></div>
    <small id="product">Radar simulé · Z · balayage 0.5°</small>
  </section>
  <div class="hotbar">
    <button id="zHot">📡<br><small>Z</small></button>
    <button id="vHot">💨<br><small>VEL</small></button>
    <button id="stormHot">🌪️<br><small>ORAGE</small></button>
    <button id="mapHot">🗺️<br><small>CARTE</small></button>
    <button id="adminHot">🛠️<br><small>ADMIN</small></button>
  </div>
</div>
<div id="modal" class="modal"><div class="window"><button id="close" class="close">Fermer</button><h2 id="title"></h2><div id="content"></div></div></div>
<script>
(function(){
'use strict';
var game=document.getElementById('game');
var ctx=game.getContext('2d');
var radar=document.getElementById('radar');
var rctx=radar.getContext('2d');
var W=0,H=0,time=0,mode='ref',camX=0,camY=0,mouseX=0,mouseY=0,flash=0;
var keys={};
var particles=[];
for(var i=0;i<260;i++) particles.push({x:Math.random(),y:Math.random(),s:.2+Math.random()*.8,a:.15+Math.random()*.5});
function resize(){W=game.width=window.innerWidth;H=game.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='z')openAdmin()});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener('mousemove',function(e){mouseX=(e.clientX/W-.5)*2;mouseY=(e.clientY/H-.5)*2});
function cloud(x,y,rx,ry,alpha){ctx.save();ctx.globalAlpha=alpha;var g=ctx.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,'#71808a');g.addColorStop(.35,'#33424b');g.addColorStop(1,'rgba(6,14,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function storm(sx,sy,scale){
ctx.save();ctx.translate(sx+mouseX*18,sy+mouseY*7);ctx.scale(scale,scale);
var glow=ctx.createRadialGradient(0,-45,20,0,-45,330);glow.addColorStop(0,'rgba(1,5,8,.98)');glow.addColorStop(.5,'rgba(11,20,27,.94)');glow.addColorStop(1,'rgba(11,20,27,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.ellipse(0,-50,330,175,0,0,Math.PI*2);ctx.fill();
for(var i=0;i<24;i++){var a=time*.15+i*.37;var yy=-130+i*6;ctx.strokeStyle=i%4===0?'rgba(121,137,145,.34)':'rgba(43,58,67,.72)';ctx.lineWidth=8-i*.18;ctx.beginPath();ctx.ellipse(Math.cos(a)*18,yy,110+i*6,35+i*.3,a*.4,.1*Math.PI,1.35*Math.PI);ctx.stroke()}
cloud(-95,-112,155,58,.72);cloud(70,-118,190,62,.7);cloud(205,-82,120,44,.5);cloud(-210,-70,125,45,.52);
ctx.save();ctx.globalAlpha=.52;ctx.fillStyle='#273840';ctx.beginPath();ctx.ellipse(92,20,135,160,.08,0,Math.PI*2);ctx.fill();ctx.restore();
cloud(-30,8,145,55,.86);cloud(-100,8,90,36,.68);
for(i=0;i<10;i++){ctx.save();ctx.globalAlpha=.3;ctx.strokeStyle='#a0adb2';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(-35,12,45+i*13,time*1.6+i*.35,time*1.6+Math.PI*1.12);ctx.stroke();ctx.restore()}
ctx.globalAlpha=.9;ctx.fillStyle='#151f24';ctx.beginPath();ctx.moveTo(-45,20);ctx.bezierCurveTo(-70,58,-45,92,-28,130);ctx.bezierCurveTo(-12,163,11,166,31,130);ctx.bezierCurveTo(50,91,58,53,31,20);ctx.closePath();ctx.fill();
ctx.globalAlpha=.22;ctx.fillStyle='#d0d8da';ctx.beginPath();ctx.ellipse(0,143,76,18,0,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=.17;ctx.strokeStyle='#b4c6cc';for(i=0;i<130;i++){var rx=-170+i*3;ctx.beginPath();ctx.moveTo(rx,35);ctx.lineTo(rx-18,245);ctx.stroke()}ctx.restore()}
function lightning(x,y){ctx.save();ctx.strokeStyle='#f2fbff';ctx.shadowBlur=32;ctx.shadowColor='#bfeaff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);for(var i=1;i<8;i++)ctx.lineTo(x+(Math.random()-.5)*55,y+i*25);ctx.stroke();ctx.restore()}
function drawWorld(){
var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#020711');sky.addColorStop(.38,'#112633');sky.addColorStop(.72,'#68757a');sky.addColorStop(1,'#223225');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
var sunX=W*.78+mouseX*25,sunY=H*.2;var sg=ctx.createRadialGradient(sunX,sunY,2,sunX,sunY,100);sg.addColorStop(0,'rgba(220,235,235,.28)');sg.addColorStop(1,'rgba(220,235,235,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*.55);
for(var i=0;i<particles.length;i++){var p=particles[i];var px=((p.x+time*.006*p.s)%1)*W;var py=p.y*H*.55;cloud(px,py,50*p.s,18*p.s,.035+p.a*.08)}
var sx=W*.68,sy=H*.34;storm(sx,sy,Math.max(.72,Math.min(1.18,W/1100)));
if(Math.random()<.009)flash=5;if(flash>0){flash--;ctx.fillStyle='rgba(225,245,255,.12)';ctx.fillRect(0,0,W,H);lightning(sx+Math.sin(time*4)*105,sy+15)}
ctx.fillStyle='#29482e';ctx.fillRect(0,H*.73,W,H*.27);ctx.fillStyle='#1b3422';for(i=0;i<90;i++){var tx=(i*173)%W,ty=H*.73+(i%9)*16;ctx.fillRect(tx,ty,2,22)}
if(keys.w)camY-=1;if(keys.s)camY+=1;if(keys.a)camX-=1;if(keys.d)camX+=1;
time+=.016;requestAnimationFrame(drawWorld)}
function radarDraw(){
var W2=radar.width,H2=radar.height,cx=180,cy=180,im=rctx.createImageData(W2,H2);var cells=[{x:.38,y:.32,s:.25,p:1},{x:.06,y:.44,s:.13,p:.7},{x:.58,y:.57,s:.10,p:.55}];
for(var y=0;y<H2;y++)for(var x=0;x<W2;x++){var dx=(x-cx)/180,dy=(y-cy)/180,v=0;for(var k=0;k<cells.length;k++){var c=cells[k],q=Math.hypot(dx-(c.x*2-1),dy-(c.y*2-1));v=Math.max(v,Math.exp(-q*q/(c.s*1.25))*85*c.p)}var rr=0,gg=0,bb=0;if(mode==='ref'){if(v<15)bb=v*6;else if(v<35){gg=80+(v-15)*4;bb=120-(v-15)*3}else if(v<55){gg=220;rr=(v-35)*5}else if(v<70){rr=240;gg=130-(v-55)*5}else{rr=255;gg=45;bb=20}}else{var signed=((x-cx)*.9-(y-cy)*.55+Math.sin(time*4)*18)*v/50;var a=Math.min(1,Math.abs(signed)/60);if(signed<0){bb=230*a;gg=130*a}else{rr=235*a;gg=80*a;bb=45*a}}var n=(y*W2+x)*4;im.data[n]=rr;im.data[n+1]=gg;im.data[n+2]=bb;im.data[n+3]=255}rctx.putImageData(im,0,0);rctx.strokeStyle='rgba(255,255,255,.3)';for(var q2=45;q2<=135;q2+=45){rctx.beginPath();rctx.arc(cx,cy,q2,0,Math.PI*2);rctx.stroke()}rctx.beginPath();rctx.moveTo(cx,0);rctx.lineTo(cx,H2);rctx.moveTo(0,cy);rctx.lineTo(W2,cy);rctx.stroke();rctx.fillStyle='#fff';rctx.beginPath();rctx.arc(cx,cy,4,0,Math.PI*2);rctx.fill()}
function setMode(m){mode=m;document.getElementById('refTab').classList.toggle('active',m==='ref');document.getElementById('velTab').classList.toggle('active',m==='vel');document.getElementById('product').textContent=m==='ref'?'Radar simulé · Z · dBZ · balayage 0.5°':'Radar simulé · VEL · kt · balayage 0.5°';document.getElementById('lo').textContent=m==='ref'?'5 dBZ':'-60 kt';document.getElementById('mid').textContent=m==='ref'?'45 dBZ':'0 kt';document.getElementById('hi').textContent=m==='ref'?'70+ dBZ':'+60 kt'}
document.getElementById('refTab').onclick=function(){setMode('ref')};document.getElementById('velTab').onclick=function(){setMode('vel')};document.getElementById('zHot').onclick=function(){setMode('ref')};document.getElementById('vHot').onclick=function(){setMode('vel')};
var modal=document.getElementById('modal');function show(title,html){modal.classList.add('open');document.getElementById('title').textContent=title;document.getElementById('content').innerHTML=html}
function openStorm(){show('🌪️ Analyse de la supercellule','<p><b>Structure :</b> supercellule HP à mésocyclone persistant.</p><p><b>Updraft :</b> puissant · <b>Enclume :</b> large.</p><p><b>Wall cloud :</b> visible · <b>Rotation :</b> forte.</p><p><b>Radar :</b> noyau à forte réflectivité et couple de vélocité simulé.</p>')}
function openMap(){show('🗺️ Carte radar','<p>Position du chasseur : secteur central.</p><p>Cellule principale : déplacement vers l’est.</p><p>Produits disponibles : <b>Z</b> et <b>VEL</b>.</p>')}
function openAdmin(){show('🛠️ Menu administrateur','<p>Contrôle de la simulation météo.</p><label>Intensité de l’orage<input id="intensity" type="range" min="1" max="10" value="8"></label><button id="reset">Réinitialiser la scène</button>');document.getElementById('reset').onclick=function(){camX=0;camY=0;time=0;modal.classList.remove('open')}}
document.getElementById('stormHot').onclick=openStorm;document.getElementById('mapHot').onclick=openMap;document.getElementById('adminHot').onclick=openAdmin;document.getElementById('close').onclick=function(){modal.classList.remove('open')};
setInterval(radarDraw,100);radarDraw();drawWorld();
})();
</script>
</body>
</html>
